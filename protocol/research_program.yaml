schema_version: "1.0.0"
programme_id: siamese_embedding_compression_research_program
programme_version: "0.2.0-draft"
status: ACTIVE_EXPLORATORY
title: Falsifiable biometric embedding compression with metric learning
owner: Guillaume Harbonnier
repository: https://github.com/gharbonnier78/siamese-embedding-compression-lab
research_question: >-
  Can supervised metric projection reduce biometric template and system cost while
  preserving decision-relevant verification and identification performance relative to
  the uncompressed embedding and matched compression controls?
scientific_object:
  input: frozen face embeddings produced by a versioned extractor
  intervention: versioned projection or compression route
  output: compressed embeddings consumed by an explicitly specified matcher and index
  excluded_claims:
    - siamese learning is universally superior
    - LFW establishes industrial low-FMR performance
    - smoke validation establishes biometric accuracy
    - internal CAL conformance is regulatory certification
primary_estimand:
  id: delta_fnmr_equal_fmr
  definition: FNMR(candidate, alpha) minus FNMR(raw, alpha)
  direction: lower_is_better
  uncertainty: paired identity-aware bootstrap confidence interval
evidence_planes:
  - biometric_matcher
  - representation_benchmark
  - system_engineering
  - decision_side_intervention
required_controls:
  - raw
  - seeded_random_projection
  - train_only_pca
  - supervised_siamese_projection
study_order:
  - study_0_lfw
  - study_1_face_backbone
  - study_2_compression_ablation
  - study_3_external_shift
  - study_4_identification_engineering
  - study_5_independent_reproduction
normative_snapshot:
  biometric_testing: ISO/IEC 19795-1:2021
  note: The published 2021 edition is used; the 2026 DIS is monitored but not claimed.
reproducibility:
  replay_contract: mmals-replay-domain-pack/1.0
  cal_contract: mmals-cal/1.0-draft
  immutable_run_required: true
  artifact_hashes_required: true
  container_or_environment_lock_required_for_qualification: true

