purpose: >-
  Test prospectively whether an identity-level delete-20-group jackknife uncertainty estimator can
  preserve the unchanged selected-artifact equal-FMR non-inferiority claim while removing enough
  excess uncertainty spread to meet the frozen 0.90 power requirement. This is a new S4N2
  methodological candidate; it does not rescue or rewrite S4N1.

