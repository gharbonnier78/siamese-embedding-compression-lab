    - deterministic_balanced_group_assignment
    - every_identity_in_exactly_one_group
    - edge_deletion_if_either_endpoint_in_group
    - full_threshold_reestimation_in_each_replicate
    - jackknife_variance_formula
    - t19_ucb_formula
    - invalid_replicate_fail_closed
    - selected_artifact_accounting
    - worker_count_seed_lineage_invariance_if_parallelized
  static_assurance_required: true
  scientific_randomness:
    root_entropy: 20260827
    reuse_s4n1_generator_seed_lineage: true
    group_assignment_contains_no_randomness: true

