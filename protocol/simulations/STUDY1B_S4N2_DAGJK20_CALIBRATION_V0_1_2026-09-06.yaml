  instruction: >-
    Finir le plan actuel sans le modifier : archiver S4N1 négatif, diagnostiquer pourquoi on
    plafonne à environ 86,9 %, puis concevoir/tester prospectivement S4N2.
  authorization_scope: prospective_nonoutcome_s4n2_design_implementation_and_synthetic_testing

basis:
  s4n1_negative_result: protocol/chronicle/STUDY1B_S4N1_CORE_POWER_CALIBRATION_RESULT_2026-09-06.yaml
  s4n1_diagnostic_result: protocol/chronicle/STUDY1B_S4N1_POWER_PLATEAU_DIAGNOSTIC_RESULT_2026-09-06.yaml
  research_note: docs/research-notes/STUDY1B_S4N2_UNCERTAINTY_ESTIMATOR_RESEARCH_2026-09-06.md
  prior_selection_contract: protocol/simulations/STUDY1B_S4N1_SELECTION_SEMANTICS_AND_CALIBRATION_DESIGN_V0_1_2026-09-04.yaml
