schema_version: "1.0.1"
contract_id: study1b_coverage_power_preflight_20260827
status: NONOUTCOME_EXECUTION_AUTHORIZED
human_authority:
  source: "2026-08-27 project conversation: explicit GO for LFW preflight + power/coverage simulation + Study 1B execution code"
  outcome_bearing_study1b_authorized: false
  geometry_authorized: false
scientific_outcomes_permitted: false
study1b_protocol: protocol/studies/study_1b_matched_compression.yaml
harness_ref: 3b109adcdd9a8cba4df029d3803ee0e5cb5bdf98

purpose: >-
  Validate, before SCREEN/TEST outcomes, that the frozen subject-slot interval behaves with
  adequate known-truth coverage on the realized Study 1B TEST graph family and that the
  preregistered all-five-seed non-inferiority rule has at least 0.90 planning power under
  the two declared non-inferior alternatives.

rng:
  root_entropy: 20260827
  derivation: task_bound_numpy_SeedSequence
  arithmetic_seed_offsets_forbidden: true
  worker_count_must_not_change_outputs: true

estimator:
  target_fmr: 0.01
  noninferiority_margin_delta_fnmr: 0.03
  ucb_quantile: 0.975
  bootstrap_replicates: 10000
  sampling_unit: identity_slot
  genuine_edge_weight: m_i
  impostor_edge_weight: m_i_times_m_j
  synthesize_unobserved_edges: false
  same_draw_for_paired_routes: true
  degenerate_fraction_limit: 0.001

coverage:
  metric: representation_delta_fnmr
  nominal_interval: percentile_two_sided_95_with_97_5_upper_bound
  dataset_checkpoints: [1000, 2000, 4000]
  stop_rule: first_checkpoint_where_all_cells_pass
  gate:
    exact_clopper_pearson_two_sided_95_lower_bound_gte: 0.93
    degenerate_fraction_lte: 0.001
  scenarios:
    - name: independent_pair_null
      target_delta_fnmr: 0.0
      subject_effect_sd_genuine: 0.0
      subject_effect_sd_impostor: 0.0
      candidate_reference_noise_correlation: 0.7
    - name: subject_dependence_null
      target_delta_fnmr: 0.0
      subject_effect_sd_genuine: 0.08
      subject_effect_sd_impostor: 0.05
      candidate_reference_noise_correlation: 0.7
    - name: subject_dependence_noninferior
      target_delta_fnmr: 0.01
      subject_effect_sd_genuine: 0.08
      subject_effect_sd_impostor: 0.05
      candidate_reference_noise_correlation: 0.7
    - name: subject_dependence_boundary
      target_delta_fnmr: 0.03
      subject_effect_sd_genuine: 0.08
      subject_effect_sd_impostor: 0.05
      candidate_reference_noise_correlation: 0.7
    - name: subject_dependence_inferior
      target_delta_fnmr: 0.05
      subject_effect_sd_genuine: 0.08
      subject_effect_sd_impostor: 0.05
      candidate_reference_noise_correlation: 0.7
  rationale: >-
    The regime family mirrors the already validated Study 0 known-truth design while changing
    the graph to the realized Study 1B graph and changing the non-inferior planning point to
    Study 1B's declared Delta=0.01. This is an explicit pre-outcome reuse, not a post-outcome
    adjustment.

power:
  simulated_datasets_per_scenario: 4000
  effect_scenarios: [0.0, 0.01]
  method_seeds: [11, 29, 47, 71, 101]
  reference_realization:
    policy: one_common_raw_reference_per_simulated_dataset
    shared_across_method_seeds: true
    rationale: >-
      The five model/projection seeds are alternative candidate realizations evaluated against
      the same realized raw512 reference dataset. Drawing a new reference world for each seed
      would violate the matched all-five-seed Study 1B question and artificially add reference
      variability to the method-level intersection rule.
  candidate_generation:
    conditional_on_common_reference: true
    pair_noise_correlation_with_reference: 0.7
    candidate_residual_stream_is_seed_specific: true
  seed_effect_model:
    distribution: centered_normal_additive_delta_fnmr
    sd: 0.005
    truncation: [-0.02, 0.02]
    rationale: >-
      Pre-outcome planning assumption representing modest optimization-seed variation. It is
      intentionally explicit and must be challenged in independent review; no Study 1B outcome
      was used to choose it.
  pass_rule: all_five_seed_ucb_below_0_03
  required_probability: 0.90
  gate: both_effect_scenarios_power_gte_0_90

execution:
  decomposition_required: true
  maximum_planned_shard_wall_time_hours: 4
  resumable: true
  append_only_progress_jsonl: true
  exact_worker_count_replay_required: true
  cost_pilot:
    scientific_gate_authority: false
    simulated_datasets: 2
    bootstrap_replicates: 100
    purpose: estimate wall_time/memory and select shard size only
    prohibited_use: interval_coverage_or_power_decision
  no_silent_reduction: >-
    A cost failure does not permit reducing the 10000 bootstrap replicates, 4000 power datasets,
    declared coverage checkpoints, graph size, or five-seed rule. A scientifically material
    change requires a versioned pre-outcome amendment and independent review.

outputs:
  raw_simulation_data_are_synthetic: true
  archive_config_seed_lineage_progress_and_summaries: true
  qualification_test_route_scores_read: false
  screen_route_scores_read: false
