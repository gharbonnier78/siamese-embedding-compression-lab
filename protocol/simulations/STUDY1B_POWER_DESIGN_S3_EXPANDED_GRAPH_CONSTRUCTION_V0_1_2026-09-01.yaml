  - optimize_pair_selection_after_power_results
  - duplicate_existing_pairs_and_call_them_new_information
  - alter_target_fmr
  - alter_noninferiority_margin
  - alter_ucb_level
  - open_screen_or_test_outcomes
  - activate_power_amendment

