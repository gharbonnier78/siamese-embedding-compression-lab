construction_rule:
  nesting_required: true
  base_graph_rows_preserved_verbatim: true
  genuine_unit_of_distinct_information: unordered_capture_pair_within_same_identity
  impostor_unit_of_distinct_information: unordered_identity_pair
  genuine_candidate_pool: >-
    Enumerate every unordered pair of TEST capture IDs belonging to the same subject,
    remove every unordered capture pair already present as genuine in the frozen TEST graph,
    then rank remaining candidates by SHA256 of the literal UTF-8 string
    "study1b-s3-genuine-v1|<subject_id>|<capture_id_1>|<capture_id_2>" with capture IDs sorted.
  genuine_selection: >-
    Sort by (sha256_hex, subject_id, capture_id_1, capture_id_2). The first 5000 additions
    define x1.5; the first 10000 additions define x2.0.
  impostor_candidate_pool: >-
    Enumerate every unordered pair of TEST subject IDs, remove every unordered identity pair
    already represented by any impostor row in the frozen TEST graph, then rank remaining
    identity pairs by SHA256 of the literal UTF-8 string
    "study1b-s3-impostor-v1|<subject_id_1>|<subject_id_2>" with subject IDs sorted.
  impostor_capture_selection: >-
    For each selected identity pair, choose one capture from each subject independently by
    minimum (SHA256("study1b-s3-capture-v1|<other_subject_id>|<capture_id>"), capture_id)
    over that subject's TEST captures. This fixes a reproducible capture realization while
    the distinct-information unit remains the previously unused identity pair.
  impostor_selection: >-
    Sort identity-pair candidates by (sha256_hex, subject_id_1, subject_id_2). The first
    50000 additions define x1.5; the first 100000 additions define x2.0.
  pair_ids:
    x1_5_genuine_prefix: test_s3x15_g_
    x1_5_impostor_prefix: test_s3x15_i_
    x2_0_genuine_prefix: test_s3x20_g_
    x2_0_impostor_prefix: test_s3x20_i_
  note_on_pair_ids: >-
    Pair IDs for newly appended rows are graph-specific labels. Scientific nesting is defined
    by the unordered capture/identity information units, not equality of graph-specific pair IDs.

required_audits:
  - active_boundary_hashes_match_frozen_values
  - exact_target_pair_counts
  - no_duplicate_genuine_capture_pair_within_each_graph
  - no_duplicate_impostor_identity_pair_among_new_rows
  - no_new_genuine_pair_overlaps_base_genuine_pairs
  - no_new_impostor_identity_pair_overlaps_base_impostor_identity_pairs
  - x1_5_new_genuine_information_is_subset_of_x2_0
  - x1_5_new_impostor_information_is_subset_of_x2_0
  - graph_sha256_recorded

prohibitions:
