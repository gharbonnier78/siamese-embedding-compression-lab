    type: null
    model: null
    driver_version: null
    runtime_version: null
    dedicated_or_shared_memory_bytes: null
    note: Phase A CPU comparison records accelerator absence or disabled state; later phases bind it explicitly.
  storage:
    device_type: null
    model: null
    filesystem: null
  operating_system:
    distribution: null
    version: null
    kernel: null
  runtime:
    python_version: null
    numpy_version: null
    scipy_version: null
    blas_backend: null
    blas_backend_version: null
    compiler_or_runtime_build_info: null
    thread_environment:
      OMP_NUM_THREADS: null
      MKL_NUM_THREADS: null
      OPENBLAS_NUM_THREADS: null
      other_relevant_thread_controls: null
  code_identity:
    repository_commit_sha: null
    benchmark_contract_path: protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_2026-09-08.yaml
    benchmark_contract_commit_sha: null
    synthetic_generator_code_sha256: null
    synthetic_root_seed: 20260908
  load_generator:
    canonical_placement: OFF_DEVICE
    host_model: null
    cpu_model: null
    ram_capacity_bytes: null
    operating_system: null
    runtime_version: null
    network_link_type: null
    nominal_link_rate: null
    measured_round_trip_baseline_ms: null
    clock_or_timestamp_method: null
    rule: >-
      The canonical load generator runs off-device so its CPU/RAM/power does not contaminate the device
      measurement. Device-side latency MUST be measured at the server boundary in addition to any client
      round-trip latency. If off-device placement is impossible, the run is diagnostic only until a
      replacement lock is independently reviewed.
  power_measurement:
    canonical_plane: EXTERNAL_DEVICE_INPUT_OR_WALL
    meter_manufacturer: null
    meter_model: null
    meter_serial_or_asset_id: null
    measurement_location: null
    sampling_rate_hz: null
    calibration_or_accuracy_reference: null
    timestamp_synchronization_method: null
    minimum_sampling_rate_hz: 10
    on_chip_telemetry_role: SUPPORTING_DIAGNOSTIC_ONLY
  battery_model:
    nominal_capacity_Wh: null
    usable_fraction: null
    reserve_fraction: null
    conversion_efficiency: null
    recharge_or_swap_policy: null

result_provenance_requirements:
  - materialized_environment_lock_path_and_commit
  - repository_commit_sha
  - benchmark_contract_path_and_commit
  - complete_command_line
  - process_environment_relevant_to_threads_and_backends
  - configuration_choice_provenance_record
  - declaration_of_any_prelock_target_workload_information
  - raw_latency_samples_or_immutable_reference
  - raw_power_samples_or_immutable_reference
  - failure_and_exclusion_log
  - device_temperature_and_throttling_log_if_available

next_action: >-
  Engineering authority supplies the actual edge device and measurement-equipment values together with provenance
  for every lock-defining choice. Materialize all required values in a new immutable execution-specific lock,
  independently review the final benchmark head and the materialized lock, and only then permit canonical Phase A execution.
