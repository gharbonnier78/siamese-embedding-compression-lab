schema_version: "1.0"
environment_lock_id: STUDY1B-JUNGLE-CHAMPIONSHIP-ENGINEERING-ENVIRONMENT-LOCK-V0.2-2026-09-08
study_id: study_1b_matched_compression
date: 2026-09-08
kind: nonoutcome_engineering_environment_lock_contract
status: BLOCKED_PENDING_PLATFORM_BINDING
supersedes_for_future_execution: protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_ENVIRONMENT_LOCK_V0_1_2026-09-08.yaml

purpose: >-
  Define the complete hardware/software/measurement environment that MUST be materialized and frozen
  before any canonical Jungle Championship Phase A engineering benchmark execution, including provenance
  for the decisions that select hardware, backend, threading and energy-measurement configuration.

scientific_boundary:
  protected_biometric_inputs_required: false
  screen_opened: false
  qualification_test_opened: false
  real_route_performance_opened: false
  representation_geometry_opened: false
  amendment_activated: false
  s4n3_launched: false

binding_rule:
  canonical_execution_permitted_only_if_all_required_values_non_null: true
  materialized_lock_must_be_committed_before_execution: true
  materialized_lock_commit_sha_must_be_recorded_in_result: true
  benchmark_contract_commit_sha_must_be_recorded_in_result: true
  no_runtime_hardware_substitution: true
  no_runtime_backend_substitution: true
  no_runtime_thread_count_tuning: true
  any_material_change_requires_new_lock_and_new_execution_identity: true
  current_gate: WAITING_FOR_TARGET_EDGE_PLATFORM_AND_MEASUREMENT_EQUIPMENT

configuration_choice_provenance:
  required_for_each_lock_defining_choice: true
  lock_defining_choices:
    - device_under_test
    - cpu_or_accelerator_platform
    - system_ram_capacity_and_type
    - search_backend_and_blas_runtime
    - benchmark_thread_count_and_affinity
    - frequency_governor_and_boost_policy
    - load_generator_host_and_link
    - external_power_meter_and_measurement_plane
    - battery_capacity_and_operational_policy_if_used
  required_fields_per_choice:
    - choice_name
    - selected_value
    - decision_authority_or_source
    - source_type
    - source_reference_or_identifier
    - evidence_date_if_known
    - target_benchmark_workload_used_to_inform_choice
    - rationale
  allowed_source_types:
    - engineering_requirement
    - preexisting_architecture_constraint
    - vendor_datasheet
    - procurement_constraint
    - independent_non_target_workload_benchmark
    - prior_operational_measurement_unrelated_to_this_target_workload
    - explicit_human_engineering_decision
  prohibited_undeclared_source_type: true

prelock_information_firewall:
  rule: >-
    No measurement produced from the target Jungle Championship Phase A workload, or from a materially
    equivalent workload intended to answer the same 512D-versus-128D hardware/backend/threading/energy question,
    may be used to choose or tune any lock-defining configuration before that configuration is frozen, regardless
    of whether the measurement is labelled smoke test, pilot, Phase 0, exploratory run, dry run, benchmark preview,
    capacity check, tuning pass or any other name.
  label_independent: true
  target_workload_measurement_may_select_hardware: false
  target_workload_measurement_may_select_backend: false
  target_workload_measurement_may_select_thread_count_or_affinity: false
  target_workload_measurement_may_select_energy_meter_or_measurement_plane: false
  target_workload_measurement_may_select_frequency_or_power_mode: false
  diagnostic_execution_after_lock_is_frozen: allowed_if_separately_identified_and_does_not_modify_lock
  if_prior_target_workload_information_already_informed_a_choice: >-
    Declare that information and the affected choice explicitly. The resulting configuration is not treated as an
    untouched prospective Phase A lock. Create a new prospective design/execution identity, freeze the configuration,
    and obtain independent review before any canonical result-bearing execution.

required_environment:
  device_under_test:
    manufacturer: null
    model: null
    hardware_revision: null
    firmware_or_bios_version: null
    power_mode: null
    cooling_configuration: null
    ambient_temperature_C: null
  cpu:
    model: null
    microcode_or_firmware: null
    physical_cores: null
    logical_threads: null
    benchmark_threads_used: null
    affinity_policy: null
    numa_topology: null
    frequency_governor: null
    turbo_or_boost_policy: null
  memory:
    system_ram_capacity_bytes: null
    memory_type: null
    rated_speed: null
    channel_configuration: null
    ecc_status: null
    swap_enabled: null
    swap_capacity_bytes: null
    requirement: >-
      Canonical Phase A requires the gallery working set to remain RAM-resident. Swap MUST be disabled,
      or measurement evidence MUST demonstrate zero swap activity throughout the run; otherwise the run
      is not admissible for RAM-residency claims.
  accelerator:
