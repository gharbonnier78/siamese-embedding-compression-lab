configuration_choice_provenance:
  required_for_each_lock_defining_choice: true
  lock_defining_choices:
    - device_under_test
    - cpu_or_accelerator_platform
    - system_ram_capacity_and_type
    - search_backend_and_blas_runtime
    - benchmark_thread_count_and_affinity
    - frequency_governor_and_boost_policy
    - load_generator_host_and_link
    - external_power_meter_and_measurement_plane
    - battery_capacity_and_operational_policy_if_used
  required_fields_per_choice:
    - choice_name
    - selected_value
    - decision_authority_or_source
    - source_type
    - source_reference_or_identifier
    - evidence_timestamp
    - provenance_attested_by
    - attester_role
    - attestation_timestamp
    - attestation_statement
    - measurement_workload_signature_if_applicable
    - informational_overlap_assessment_if_applicable
    - target_or_informative_workload_evidence_used_to_inform_choice
    - rationale
  attestation_requirements:
    provenance_attested_by_must_identify_human_or_accountable_role: true
    system_only_attester_permitted: false
    attestation_timestamp_required: true
    attestation_statement_required: true
    canonical_statement: >-
      I attest that the provenance record is complete to the best of my knowledge for this lock-defining choice,
      including any prior measurement that was materially informative about the frozen Phase A comparison.
  allowed_source_types:
    - engineering_requirement
    - preexisting_architecture_constraint
    - vendor_datasheet
    - procurement_constraint
    - preexisting_measurement
    - explicit_human_engineering_decision
  prohibited_undeclared_source_type: true

measurement_source_requirements:
  applies_when_source_type: preexisting_measurement
  evidence_timestamp_required: true
  required_measurement_workload_signature_fields:
    - vector_dimensions
    - search_family
    - index_mode
    - hardware_class
    - hardware_model_if_known
    - datatype_if_known
    - gallery_scale_if_known
    - measurement_reference
  informational_overlap_rule:
    criterion: >-
      A prior measurement is MATERIAL_INFORMATIONAL_OVERLAP when its workload shares a vector dimensionality
      under evaluation (128 or 512), the same search/index computational family used by Phase A, and the same
      hardware class under consideration. Classification is based on observable workload attributes, not on
      the stated purpose, label or intent of the prior measurement.
    target_vector_dimensions: [128, 512]
    target_search_family: EXACT_DENSE_DOT_PRODUCT_TOP1
    target_index_mode: none
    hardware_class_source: required_environment.device_under_test.hardware_class
    intended_purpose_is_a_classifier_input: false
    label_is_a_classifier_input: false
  overlap_consequence: >-
    A measurement classified MATERIAL_INFORMATIONAL_OVERLAP MUST be declared as informative evidence. It MAY NOT
    silently select or tune an untouched prospective canonical lock. If it informed a lock-defining choice, create
    a newly identified prospective design/execution identity, freeze it, and obtain independent review before any
    canonical result-bearing execution.
  open_semantic_hardening_item: >-
    R1/N2 remains open and is intentionally not changed by this D2-only revision. The current conjunction of
    dimensionality, search family and hardware class may under-classify evidence informative for portable choices
    such as BLAS/backend selection, threading/affinity or energy-measurement methodology. Any classifier change must
    be prospective and independently reviewed before the execution-specific lock is frozen.

prelock_information_firewall:
  rule: >-
    No prior measurement with MATERIAL_INFORMATIONAL_OVERLAP may silently choose or tune any lock-defining
    configuration. This prohibition is determined from vector dimensionality, search/index family and hardware
    class overlap, not from the measurement's stated intent. It applies regardless of labels such as smoke test,
    pilot, Phase 0, exploratory run, dry run, preview, capacity check or tuning pass.
  label_independent: true
  intent_independent: true
  target_or_informative_measurement_may_silently_select_hardware: false
  target_or_informative_measurement_may_silently_select_backend: false
  target_or_informative_measurement_may_silently_select_thread_count_or_affinity: false
  target_or_informative_measurement_may_silently_select_energy_meter_or_measurement_plane: false
  target_or_informative_measurement_may_silently_select_frequency_or_power_mode: false
  diagnostic_execution_after_lock_is_frozen: allowed_if_separately_identified_and_does_not_modify_lock
  if_prior_informative_measurement_already_informed_a_choice: >-
    Declare the measurement, workload signature, evidence timestamp and affected choice explicitly. The resulting
    configuration is not treated as an untouched prospective Phase A lock. Create a new prospective design/execution
    identity and obtain independent review before any canonical result-bearing execution.

negative_fact_responsibility_split:
  rationale: >-
    A public commit timestamp bounds repository-public knowability but cannot prove what the author or commissioning
    party knew before publication. D1 and D2 therefore discharge different provenance cases and neither substitutes
    for the other.
  d2_public_ordering:
    role: TEMPORAL_STRUCTURAL_IMPOSSIBILITY_FOR_EXTERNAL_PREEXISTING_EVIDENCE
    may_discharge_negative_only_for:
      - genuinely_third_party_evidence
      - preexisting_external_evidence
    requirements:
      - provenance establishes evidence_timestamp strictly earlier than the repository public-information bound
      - provenance identifies the evidence source independently of the attesting party's production or commissioning
      - evidence was not produced, commissioned, requested, reviewed, received or otherwise known by the attesting party
    cannot_substitute_for_d1_attestation: true
  d1_accountable_attestation:
    role: ACCOUNTABLE_NEGATIVE_FACT_FOR_ATTESTER_KNOWLEDGE_AND_ACTIONS
    required_for_evidence_that_was:
      - produced_by_attesting_party
      - commissioned_by_attesting_party
      - requested_by_attesting_party
      - reviewed_by_attesting_party
      - received_by_attesting_party
      - otherwise_known_by_attesting_party
    applies_even_if_evidence_predates_public_commit_time: true
    public_anchor_does_not_discharge_this_case: true
  conflict_rule: >-
    If evidence could fall under both cases or provenance is ambiguous, require D1 attestation and treat the evidence
    as potentially informative; do not use D2 ordering alone to certify an untouched prospective lock.

structural_impossibility_anchor:
  rule: >-
    Use a conservative repository-public-information bound: the earliest immutable repository commit at which the
    core 512D-versus-128D engineering intervention and a retrieval/storage/latency measurement family were public
    enough that a repository-informed prior measurement could plausibly become materially informative for later
    lock-defining choices. Do not wait for every final Phase A detail to be published. In this repository the root
    commit already satisfies that conservative criterion, making the bound mechanically terminal.
  bound_type: CONSERVATIVE_REPOSITORY_ROOT_PUBLIC_INFORMATION_BOUND
  earliest_workload_defining_commit_sha: 4b40e7254bff1b88a44d13fb55b366bc7d3fc263
  earliest_workload_defining_commit_timestamp_utc: "2026-08-07T08:23:56Z"
  earliest_workload_defining_artifact: README.md
  immutable_source_url: https://github.com/gharbonnier78/siamese-embedding-compression-lab/blob/4b40e7254bff1b88a44d13fb55b366bc7d3fc263/README.md
  repository_root_commit: true
  repository_root_parent_count: 0
  information_public_at_anchor:
    vector_dimensions: [512, 128]
    float32_template_storage_comparison_present: true
    future_engineering_measurement_family:
      - 1_to_N_retrieval
      - gallery_indexing
      - latency_measurements
    exact_final_phase_a_contract_already_frozen: false
    cpu_g0_g2_threading_and_power_methodology_already_frozen: false
  evidence_timestamp_must_be_strictly_earlier_than_anchor_for_structural_impossibility: true
  structural_impossibility_claim_available_for_qualifying_pre_anchor_external_evidence: true
  structural_impossibility_claim_available_for_attester_produced_or_commissioned_evidence_without_d1: false
  conservative_interpretation: >-
    This root bound intentionally rejects all repository-internal or repository-informed measurements produced after
    repository inception from being certified uninformed by D2 ordering alone. Some such measurements may in fact
    have been uninformed by the later Jungle Championship design; conservative rejection is preferable to using a
    later specification timestamp that creates an avoidable permissive window.
  prior_disproven_anchor:
    commit_sha: 878bfe2a64b34cce474a627d04b30233e2356958
    timestamp_utc: "2026-09-07T06:33:05Z"
    disposition: SUPERSEDED_FOR_FUTURE_EXECUTION_NOT_EARLIEST
  history_audit_reference: protocol/reviews/PR50_D2_BOUNDED_BACKWARD_HISTORY_AUDIT_2026-09-10.md

