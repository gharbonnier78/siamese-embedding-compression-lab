purpose: >-
  Define the complete hardware, software, measurement and decision-provenance environment that MUST be
  materialized and frozen before any canonical Jungle Championship Phase A engineering benchmark execution.
  This prospective revision preserves the accepted D1 and D3 mechanisms, replaces the disproven v0.4 D2 anchor
  with the repository-root public-information bound established by the bounded backward history audit, and makes
  explicit the reviewer-requested responsibility split: D2 temporal ordering can discharge only genuinely
  third-party or pre-existing external evidence, while D1 accountable attestation carries the negative for evidence
  produced, commissioned, requested, reviewed, received or otherwise known by the attesting party.

