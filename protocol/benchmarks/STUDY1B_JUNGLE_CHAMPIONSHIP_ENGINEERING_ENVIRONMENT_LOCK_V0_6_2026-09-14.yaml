negative_fact_responsibility_split:
  D2_public_ordering:
    role: TEMPORAL_PUBLIC_ORDERING_FOR_EXTERNAL_PREEXISTING_EVIDENCE
    may_discharge_negative_only_for:
      - genuinely_third_party_evidence
      - preexisting_external_evidence
    mechanically_checkable_component: >-
      The evidence timestamp is strictly earlier than the immutable repository-public information bound.
    provenance_backed_conditions:
      - source_is_genuinely_external_or_preexisting
      - attesting_party_did_not_influence_creation_or_framing
    mere_receipt_possession_citation_or_review_is_not_creation_influence: true
    may_remain_applicable_after_attester_receives_or_reviews_preexisting_external_evidence: true
    cannot_substitute_for_D1_attestation: true
    rule: >-
      D2 can establish only a bounded public-ordering fact for external/pre-existing evidence. It does not certify
      the entire independence story as objective. A pre-existing vendor datasheet or external measurement does not lose
      D2 eligibility merely because the attester later receives, reviews or cites it. If the attester produced,
      commissioned, requested, specified, directed or materially framed the evidence, D1 treatment is required.

  D1_accountable_attestation:
    role: ACCOUNTABLE_NEGATIVE_FACT_FOR_ATTESTER_KNOWLEDGE_AND_INFLUENCE
    required_for_evidence_that_was:
      - produced_by_attesting_party
      - commissioned_by_attesting_party
      - requested_by_attesting_party
      - specified_or_directed_by_attesting_party
      - materially_framed_by_attesting_party
    completeness_backstop_applies_to_all_lock_defining_choices: true
    applies_even_if_evidence_predates_public_commit_time: true
    public_anchor_does_not_discharge_creation_or_framing_influence: true
    rule: >-
      D1 accountable attestation carries the negative-fact burden for evidence whose creation or framing was under
      the attesting party's influence and remains the completeness backstop for all lock-defining choices. Mere later
      possession/review of genuinely pre-existing external evidence is disclosed in provenance but is not itself proof
      that the attester influenced its creation.

  conflict_rule: >-
    If provenance is ambiguous, creation/framing influence cannot be ruled out, or the evidence could fall under both
    cases, require D1 and classify the evidence as potentially informative. Do not use D2 ordering alone to certify an
    untouched prospective lock.

