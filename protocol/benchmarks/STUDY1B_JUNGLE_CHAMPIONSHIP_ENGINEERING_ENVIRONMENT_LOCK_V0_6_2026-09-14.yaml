  repository_root_parent_count: 0
  evidence_timestamp_must_be_strictly_earlier_than_anchor_for_public_ordering_claim: true
  label_scope_note: >-
    Only the temporal ordering against this immutable root bound is mechanically checkable from repository history.
    External/pre-existing source classification and absence of attester influence over creation/framing are provenance
    claims subject to accountable attestation and fail-closed conflict handling. Downstream users MUST NOT cite
    'structural impossibility' as if the whole D1/D2 mechanism were objective.

measurement_source_requirements:
  evidence_timestamp_required_for_measurement_sources: true
  minimum_signature_fields_when_applicable:
    - measurement_reference
    - evidence_timestamp
    - source_type
    - hardware_class
    - vector_dimensions
    - search_family
    - datatype_or_precision
    - backend_or_blas
    - threading_or_affinity
    - measurement_plane
    - load_generation_method
    - choices_potentially_informed
    - attributable_overlap_assessment
  choice_specific_information_firewall:
    classification_basis: CHOICE_SPECIFIC_INFORMATIONAL_OVERLAP
    intent_is_classifier_input: false
    label_is_classifier_input: false
    uncertainty_defaults_to_informative: true
    not_informative_requires_attributable_rationale: true

    platform_specific:
      choices:
        - device_under_test
        - cpu_or_accelerator_platform
        - system_ram_capacity_and_type
        - frequency_governor_and_boost_policy
      hardware_class_may_be_required: true
      rule: >-
        Hardware class or a materially comparable platform normally matters for platform-specific choices. Evidence
        from a different class may still be informative if an attributable engineering rationale shows transferability.

    search_runtime_portable:
      choices:
        - search_backend_and_blas_runtime
      hardware_class_required: false
      rule: >-
        Prior dense-search/kernel evidence may be informative across hardware classes when search family, precision,
        vector shape or runtime characteristics are materially comparable. Hardware mismatch alone cannot discharge
        informational relevance for backend or BLAS/runtime selection.

    concurrency_portable:
      choices:
        - benchmark_thread_count_and_affinity
      hardware_class_required: false
      rule: >-
        Thread-count, affinity, oversubscription, NUMA and runtime-parallelism studies may be informative across hardware
        classes when they concern the same backend/search execution family or a materially comparable threading model.

    measurement_method_portable:
      choices:
        - load_generator_host_and_link
        - external_power_meter_and_measurement_plane
        - battery_capacity_and_operational_policy_if_used
      hardware_class_required: false
      vector_dimension_required: false
      search_family_required: false
      rule: >-
        Evidence about measurement-plane design, power-meter placement, sampling, synchronization, load-generation
        contamination, joules-per-identification accounting or battery reserve policy can transfer across hardware and
        workload classes. Classify against the measurement-method choice itself rather than the compute platform.

  allowed_per_choice_classification:
    - INFORMATIVE
    - NOT_INFORMATIVE_WITH_RATIONALE
    - UNCERTAIN_TREAT_AS_INFORMATIVE

  consequence_if_informative_evidence_already_informed_choice: >-
    Declare the evidence, timestamp, observable signature, affected choice and attributable rationale. The resulting
    configuration is not represented as an untouched prospective lock. Assign a new prospective design/execution
    identity, freeze it, and obtain independent review before canonical result-bearing execution.

