schema_version: "1.0.1"
contract_id: study_0_subject_bootstrap_coverage_v0_2_2
purpose: validate_subject_bootstrap_interval_coverage_before_historical_reanalysis
status: EXECUTION_AUTHORIZED
historical_study_0_scores_permitted: false
root_seed: 20260807
rng_hierarchy:
  derivation: numpy_seedsequence_spawn
  bit_generator: PCG64
  levels:
    - root
    - scenario
    - scenario_graph_or_dataset
    - dataset_distance_or_bootstrap
  arithmetic_seed_offsets_forbidden: true
  shared_generator_between_datasets_forbidden: true
  worker_count_must_not_change_outputs: true
  isolated_dataset_replay_from_seed_lineage_required: true
  note: "Pre-outcome execution clarification only; does not change estimands, scenarios, bootstrap weights, thresholds, or coverage criteria."
execution:
  engine: vectorized
  reference_oracle_engine: legacy
  exact_dataset_outcome_equivalence_required: true
  implementation_only: true
  note: "Pre-outcome execution selection after exact legacy/vectorized replay and non-outcome profiling; changes execution cost only, not the frozen statistical contract."
bootstrap:
  replicates_per_simulated_dataset: 10000
  rng: numpy_generator_pcg64
  checkpoint_axis_note: "Inner estimator axis; Study 0 section 8 uses 2000/5000/10000 bootstrap-replicate convergence checkpoints."
simulation_precision:
  dataset_checkpoints: [2000, 4000, 10000]
  checkpoint_axis_note: "Outer validation axis; counts independently simulated datasets, not bootstrap replicates."
  stop_rule: first_checkpoint_where_all_metric_mcse_lte_0_005
  maximum_monte_carlo_standard_error: 0.005
coverage_gate:
  nominal_coverage: 0.95
  binomial_interval: clopper_pearson_exact_two_sided_95
  lower_bound_minimum: 0.93
  pooled_coverage_can_satisfy_gate: false
  degenerate_dataset_tolerance: 0
metrics:
  - representation_delta_fnmr
  - operational_fnmr
  - operational_fmr
graph:
  subjects: 963
  genuine_edges: 500
  impostor_edges: 500
  sparse_degree_exponent: 1.1
  synthesize_missing_edges: false
scenarios:
  - name: independent_pair_null
    target_delta_fnmr: 0.0
    subject_effect_sd_genuine: 0.0
    subject_effect_sd_impostor: 0.0
    candidate_reference_noise_correlation: 0.7
  - name: subject_dependence_null
    target_delta_fnmr: 0.0
    subject_effect_sd_genuine: 0.08
    subject_effect_sd_impostor: 0.05
    candidate_reference_noise_correlation: 0.7
  - name: subject_dependence_noninferior
    target_delta_fnmr: 0.015
    subject_effect_sd_genuine: 0.08
    subject_effect_sd_impostor: 0.05
    candidate_reference_noise_correlation: 0.7
  - name: subject_dependence_boundary
    target_delta_fnmr: 0.03
    subject_effect_sd_genuine: 0.08
    subject_effect_sd_impostor: 0.05
    candidate_reference_noise_correlation: 0.7
  - name: subject_dependence_inferior
    target_delta_fnmr: 0.05
    regime_note: "Beyond frozen NI margin delta=0.03; validates interval coverage here, not a separate inferiority decision gate."
    subject_effect_sd_genuine: 0.08
    subject_effect_sd_impostor: 0.05
    candidate_reference_noise_correlation: 0.7
review_boundary:
  must_be_accepted_before_gate_execution: true
  changing_after_seeing_historical_study_0_scores: forbidden
  changing_after_gate_failure_requires_versioned_amendment: true
