schema_version: "1.1.2"
study_id: study_1_face_backbone
title: Face-specific backbone 1:1 compression study
status: DRAFT_PREREGISTRATION
claim_level: NONE_UNTIL_EXECUTED
human_readable_checklist: protocol/studies/study_1_preregistration.md
lesson_learned: docs/LESSONS_LEARNED_STUDY0_PROGRESSIVE_EVIDENCE.md
purpose: >-
  Test whether pair supervision adds compression value when the frozen source embedding
  is produced by a face-specific extractor rather than an ImageNet classifier, using an
  explicit screen-then-qualify evidence escalation so that full qualification cost is paid
  only after a non-claim-bearing screening signal justifies it.
strategy:
  mode: progressive_evidence_escalation
  study_1_execution_permitted: false
  screening_is_claim_bearing: false
  qualification_test_open_during_screening: false
  screening_outcomes_may_drop_unfavorable_qualification_seeds: false
  geometry_exploration_permitted: false
study_0_backbone_lesson:
  source_backbone: torchvision_resnet18_imagenet
  source_backbone_frozen: true
  face_pair_trained_component: linear_512_to_128_head_only
  descriptive_test_optimized_accuracy_context:
    raw_512d: 0.715
    siamese_128d_min: 0.730
    siamese_128d_max: 0.747
    pca_128d_min: 0.741
    pca_128d_max: 0.743
    claim_status: DESCRIPTIVE_TEST_TUNED_NOT_DEPLOYABLE
  consequence: >-
    The Study 0 source representation was trained for ImageNet object classification, not
    face identity discrimination. A linear projection can reorganize retained information
    but cannot reconstruct identity information absent from the frozen source embedding.
    Study 1 therefore changes the source backbone before re-testing compression.
backbone_policy:
  primary_design: pretrained_frozen_face_specific_extractor
  backbone_training_is_part_of_primary_study: false
  candidate_family: arcface_iresnet
  secondary_candidate_family: adaface_if_separately_preregistered
  must_pin_before_screening:
    - architecture
    - preprocessing
    - weights_sha256
    - source_url_or_artifact_identity
    - licence
    - face_training_objective
    - training_corpus
    - training_provenance
    - detector_alignment_normalization_pipeline
  anti_selection_guard: >-
    Do not screen many face backbones and retain whichever looks best. Any multi-backbone
    comparison must itself be preregistered before SCREEN outcomes are opened.
prerequisites:
  study_0_corrected_reanalysis_closure:
    status: SATISFIED
    commit: 935b3dd02fd11d47b6b64a14d1cdef59eddecbb4
    decision: evidence/study_0_subject_bootstrap_v0.2.2/STUDY0_CLOSURE_DECISION_2026-08-19.yaml
    consequences:
      E_STAT_001: REANALYZED
      G2: PASS
      C_NI_001: NOT_DEMONSTRATED
      C_SUP_001: NOT_DEMONSTRATED
    note: >-
      This prerequisite being satisfied does not itself authorize Study 1 screening or
      qualification execution.
blocking_items:
  - independently review and merge this Study 1 design amendment
  - obtain a separate researcher authorization before any Study 1 screening execution
  - pin face-specific backbone architecture, weights, training provenance and licence
  - pin projection-development, screening and untouched qualification datasets
  - declare target population and capture regimes
  - run training/evaluation identity-overlap and near-duplicate audits
  - freeze the screening promotion and stop rule before opening screening outcomes
  - calculate identity-and-capture sample size for the selected target FMR and uncertainty requirement
  - freeze primary FMR, non-inferiority margin and multiplicity policy
  - freeze compute budget and all qualification seeds
data_roles:
  backbone_training:
    role: provenance_only_for_primary_study
    requirement: >-
      The frozen face backbone's training corpus must be documented sufficiently to audit
      identity overlap with SCREEN and qualification benchmarks. Backbone training is not
      itself executed as part of the primary Study 1 compression experiment.
  projection_development:
    role: TRAIN_VALIDATION
    requirements:
      - sufficiently_many_identities_and_captures
      - authorized_access_and_licence
      - identity_disjoint_from_qualification
      - provenance_and_hashes_recorded
    candidate: VGGFace2_if_legitimately_available
    candidate_note: >-
      VGGFace2 is scientifically attractive for pose and age diversity, but the original
      Oxford download is no longer available. It must not be assumed as an automatically
      reproducible dependency; an alternative authorized corpus may be selected if it meets
      the same role and disjointness requirements.
  screening:
    role: EXPLORATORY_SCREENING_NOT_FOR_CLAIM
    candidate_suite:
      - LFW
      - CFP_FP
      - AgeDB_30
      - CALFW
      - CPLFW
    intended_stress_axes:
      LFW: continuity_and_basic_sanity
      CFP_FP: frontal_profile
      AgeDB_30: age_variation
      CALFW: cross_age
      CPLFW: cross_pose
    overlap_guard: >-
      Common web-scale face-training corpora may overlap identities with LFW-family
      benchmarks. Unresolved overlap does not make screening useless for triage, but such
      evidence cannot be promoted to independent qualification evidence.
  qualification:
    role: untouched_TEST
    preferred_public_candidate: IJB_C_1_to_1_template_verification
    rationale: >-
      IJB-C contains substantially richer unconstrained still/video material and many more
      impostor template comparisons than LFW, making lower false-accept regions measurable.
    prerequisites:
      - lawful_authorized_access_confirmed
      - backbone_training_identity_overlap_audited
      - projection_train_validation_identity_overlap_zero
      - protocol_and_template_aggregation_frozen
      - preprocessing_frozen
      - target_fmr_far_and_precision_supported
    downgrade_rule: >-
      If training/test identity disjointness or lawful access cannot be established, retain
      the result only as an external benchmark rather than strong independent qualification.
  operational_external_validity:
    role: later_study_not_study1_primary
    requirement: >-
      Public celebrity benchmarks do not establish representativity for a specific passport,
      border, mobile, national-gallery or other production population/capture process. Such
      claims require authorized population- and capture-relevant data in a later study.
screening:
  status: DRAFT_NOT_AUTHORIZED_FOR_EXECUTION
  evidence_mode: EXPLORATORY_SCREENING_NOT_FOR_CLAIM
  objective: >-
    Decide whether the face-specific backbone and at least one 128D compression route show
    enough decision-relevant low-FMR promise to justify a full qualification campaign.
  dataset_role: dedicated_screening_set_only
  qualification_test_access: forbidden
  routes: [raw, random, pca, siamese]
  dimensions: [128]
  predeclared_screening_seeds: [11, 29]
  screening_seeds_are_not_qualification_seed_selection: true
  minimum_checks:
    - raw_backbone_viability_at_decision_relevant_low_fmr
    - matched_raw_random_pca_siamese_comparison
    - threshold_transfer_diagnostic
    - basic_storage_and_compute_value
  promotion_rule:
    status: TO_BE_FROZEN_BEFORE_SCREENING
    requirements:
      - raw_backbone_is_credible_at_the_screening_low_fmr_endpoint
      - at_least_one_compression_route_has_plausible_retention_signal_against_raw_and_matched_controls
      - expected_engineering_value_is_large_enough_to_justify_qualification_cost
    note: >-
      Promotion is a research-investment decision, not a scientific claim. Numerical
      screening thresholds must be frozen before outcomes are read.
  stop_rule:
    - stop_or_redirect_if_raw_backbone_is_not_viable_at_the_relevant_operating_point
    - stop_or_redirect_if_no_compression_route_has_a_credible_retention_signal
    - preserve_negative_screening_result_and_do_not_open_qualification_test
qualification:
  status: BLOCKED_PENDING_SCREENING_PROMOTION_AND_PREREGISTRATION
  routes: [raw, random, pca, siamese]
  dimensions: [128]
  planned_seeds: [11, 29, 47, 71, 101]
  split_unit: identity
  threshold_policy: validation_then_freeze
  test_open_policy: once_after_all_routes_and_qualification_rules_are_frozen
  representation_endpoint: delta_fnmr_equal_fmr_non_deployable
  operational_endpoint: validation_frozen_fnmr_with_test_fmr_constraint
  secondary_endpoints: [eer_descriptive, roc_auc_descriptive, threshold_transfer]
  uncertainty: SUBJECT_SLOT_BOOTSTRAP_VALIDATED_AND_G2_PASS_IN_STUDY0
  random_control: gaussian_variance_1_over_d_then_l2_normalize
sample_size:
  status: BLOCKED
  target_power: 0.90
  criterion: probability_upper_confidence_bound_below_delta
  effect_scenarios: [0.0, 0.01]
  primary_sampling_units: [identities, captures]
  pair_counts_not_independent_sample_size: true
  simulation_requirements:
    - identity_and_capture_dependence
    - genuine_and_impostor_trial_construction
    - low_fmr_threshold_uncertainty
    - raw_candidate_correlation
    - inter_seed_variation
    - all_declared_seeds_rule
results: null
decision:
  state: INDETERMINATE
  rationale: >-
    Study 0 corrected reanalysis is now closed and G2 is PASS for that bounded scope, but
    Study 1 remains draft and unexecuted. The design requires an explicit exploratory
    screening stage before any qualification campaign, independent review/merge of this
    amendment, all remaining preregistration inputs, and a separate researcher authorization
    before screening execution.
