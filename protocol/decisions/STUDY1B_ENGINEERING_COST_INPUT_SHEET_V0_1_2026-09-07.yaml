study_id: study_1b_matched_compression
date: 2026-09-07
status: AWAITING_ENGINEERING_VALUES
kind: nonoutcome_engineering_cost_input_sheet

purpose: >-
  Collect the minimum engineering and economic inputs needed to convert the structural 512D-to-128D
  benefit envelope into C_miss and a value-of-information comparison for additional independent
  evidence, without opening protected Study 1B outcomes or inventing product economics.

scientific_boundary:
  real_study_outcomes_opened: false
  screen_opened: false
  qualification_test_opened: false
  real_route_performance_opened: false
  representation_geometry_opened: false
  amendment_activated: false
  s4n1_status: CLOSED_NEGATIVE
  s4n2_status: CLOSED_NEGATIVE
  s4n3_launched: false

working_policy:
  pass: PROMOTE_TO_CONTROLLED_NEXT_ENGINEERING_OR_QUALIFICATION_STAGE
  not_demonstrated: RETAIN_RAW512_BY_DEFAULT
  additional_evidence_rule: REQUIRE_POSITIVE_VALUE_OF_INFORMATION

exact_structural_constants:
  d_raw: 512
  d_comp: 128
  dimension_ratio: 0.25
  vector_payload_reduction_fraction_same_dtype_encoding: 0.75
  s4n1_best_power: 0.869
  frozen_target_power: 0.90
  s4n1_power_gap: 0.031

