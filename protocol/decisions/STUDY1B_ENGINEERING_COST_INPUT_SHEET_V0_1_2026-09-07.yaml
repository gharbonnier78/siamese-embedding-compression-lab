calculation_contract:
  raw_vector_bytes: "N * 512 * b"
  compressed_vector_bytes: "N * 128 * b"
  vector_bytes_avoided: "N * 384 * b"
  replicated_vector_bytes_avoided: "N * 384 * b * r"
  storage_value: "N * 384 * b * r * R_storage"
  transfer_value: "Q * 384 * b * R_transfer"
  total_128d_value: "V_storage + V_transfer + V_compute + V_capacity + V_enabling"
  C_miss: >-
    delayed_or_foregone(V_128D) + avoidable_requalification_cost + avoidable_schedule_or_opportunity_cost,
    with explicit protection against double-counting.
  s4n1_value_of_recovering_gap_to_90: "q * 0.031 * C_miss"
  break_even_rule: >-
    Additional independent evidence is economically justified on the missed-demonstration side alone only
    if its incremental cost is lower than q * 0.031 * C_miss. False-qualification risk must be considered separately.

provenance_rule: >-
  Every populated non-structural value must identify its source, owner, measurement, estimate class or explicit
  assumption. Unknown values remain null; they must not be guessed from Study 1B protected outcomes.

next_action: >-
  Populate this sheet with explicit engineering values, then compute C_miss and the break-even value of additional
  independent evidence. Any future power/design change remains prospective and cannot reclassify S4N1 or S4N2.

