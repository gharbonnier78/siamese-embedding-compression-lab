study_id: study_1b_matched_compression
date: 2026-09-06
status: AWAITING_HUMAN_ENGINEERING_INPUTS
kind: nonoutcome_operational_decision_input_contract

purpose: >-
  Turn the residual S4 power question into explicit engineering inputs. This artifact records
  what can already be stated from the study design, separates those statements from unresolved
  operational assumptions, and prevents unavailable product economics or real Study 1B outcomes
  from being guessed.

