summary: >-
  The prospectively frozen S3 power calibration completed successfully as an execution but
  closed scientifically negative. Neither x1.5 nor x2.0 additional-information design reached
  the required 0.90 power in both preregistered true-delta scenarios under the unchanged
  all-five-seed non-inferiority rule. S3 therefore selects no information-expansion candidate
  and moves the design question to S4 method-level specification or STOP. No real Study 1B
  compression outcome was opened.

