reason_for_new_cycle: >-
  The accepted reviewer recorded N4, N5 and R1/N2 as non-blocking for the v0.5 verdict but requiring closure before an
  execution-specific lock is frozen. This cycle addresses those items prospectively without re-opening or rewriting
  the accepted D1-D3 history.

prospective_changes:
  N4_possession_vs_influence:
    prior_finding: >-
      D2's prior disqualifier list conflated creation/framing influence with mere possession, receipt or review and could
      therefore collapse D2's practical scope into D1 even for genuinely pre-existing external evidence.
    v0_6_rule: >-
      Mere receipt, possession, citation or review does not by itself establish influence over evidence creation or
      framing. Production, commissioning, requesting, specifying, directing or materially framing evidence requires D1.
      D1 completeness attestation remains mandatory and ambiguity defaults to D1.
    status: CORRECTED_PROSPECTIVELY_AWAITING_REVIEW
  N5_structural_impossibility_label_scope:
    prior_finding: >-
      Only temporal ordering is mechanically checkable; external-origin and attester-influence negatives are
      provenance/attestation-backed and should not be described as though the entire mechanism were objective.
    v0_6_rule: >-
      Public ordering against the repository-root timestamp is the mechanically checkable D2 component. Source origin,
      absence of creation/framing influence and completeness of disclosed evidence remain accountable provenance claims.
    status: CORRECTED_PROSPECTIVELY_AWAITING_REVIEW
  R1_N2_portable_choice_overlap:
    prior_finding: >-
      The global dimension AND search-family AND hardware-class conjunction under-classified cross-hardware evidence
      that may inform portable backend/BLAS, threading/affinity and measurement-method choices.
    v0_6_rule: >-
      Informational overlap is classified per lock-defining choice. Hardware class may matter for platform-specific
      choices but is not required for portable backend/BLAS, concurrency or measurement-method evidence. Uncertainty
      defaults to informative and NOT_INFORMATIVE requires attributable rationale.
    status: CORRECTED_PROSPECTIVELY_AWAITING_REVIEW
  N6_review_transport:
    prior_finding: >-
      Reference-only packages regressed reviewability because normative artifacts were not locally inspectable or
      independently Git-blob-verifiable by the reviewer.
    adopted_process_rule: >-
      Future packages ship exact normative artifacts together with expected Git blob SHA-1 values and instructions for
      local recomputation of SHA1('blob ' + byte_length + NUL + content). The package must remain self-contained for the
      focused tests it asks the reviewer to execute.
    status: ADOPTED_FOR_NEXT_REVIEW_PACKAGE

