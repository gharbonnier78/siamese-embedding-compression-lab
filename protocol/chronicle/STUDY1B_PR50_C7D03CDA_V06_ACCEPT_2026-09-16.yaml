    implementation_fact_not_available_to_reviewer_from_manifest: >-
      The reviewed package builder obtained expected values via git rev-parse <head>:<path> and compared local bytes to
      that repository object before packaging. N7 concerns making that source provenance explicit in the transported
      manifest rather than changing the already verified bytes.
  N8_binding_and_workflow_transport:
