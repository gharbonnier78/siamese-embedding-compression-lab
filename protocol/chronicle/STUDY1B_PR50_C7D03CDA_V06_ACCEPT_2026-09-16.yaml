    blocks_current_v0_6_semantic_accept: false
    must_close_before_next_delegated_review_package: true
    finding: >-
      The manifest records git_blob_sha1_expected but does not declare that the expected value originates from the
      repository object at the immutable reviewed head. Internal agreement between transported bytes and an authored
      expected value is weaker than explicit repository-object provenance.
    requested_hardening:
