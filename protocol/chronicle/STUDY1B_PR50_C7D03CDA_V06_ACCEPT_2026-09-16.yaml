accepted_semantic_hardening:
  N4_possession_vs_influence:
    accepted: true
    note: >-
      Mere receipt, possession, citation or review is separated from creation/framing influence. Genuinely pre-existing
      external evidence can remain D2-eligible after later receipt or review, while produced, commissioned, requested,
      specified, directed or materially framed evidence requires D1. D1 completeness remains a backstop for every
      lock-defining choice and ambiguity fails closed.
  N5_checkable_vs_attested:
    accepted: true
    note: >-
      Only temporal ordering against the immutable repository-public bound is represented as mechanically checkable.
      External/pre-existing source classification, absence of attester influence and completeness remain provenance or
      attestation claims. The prior misleading structural-impossibility mechanism label is not carried forward.
  R1_N2_choice_specific_overlap:
    accepted: true
    note: >-
      Informational overlap is classified per lock-defining choice. Portable backend/BLAS, concurrency and
      measurement-method evidence can remain informative across hardware when transferability is attributable. The
      measurement-method class does not require vector dimension or search family. If informative prior evidence has
      already shaped a choice, disclosure plus a new frozen design/execution identity and independent review are
      required rather than silent reinterpretation.
  N6_transport:
    accepted_for_reviewed_package: true
    note: >-
      Exact normative bytes were transported and reviewer-side Git blob identity was independently recomputed for all
      sixteen repository sources.

