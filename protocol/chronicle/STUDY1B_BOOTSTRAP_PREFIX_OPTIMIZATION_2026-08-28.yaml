engineering_change_fr: >-
  La recherche du seuil à FMR cible calcule le poids imposteur total une seule fois puis
  examine d'abord un préfixe déterministe des distances imposteurs triées. Les blocs d'égalité
  sont conservés entiers. Si le franchissement du FMR cible n'est pas trouvé, le préfixe est
  étendu sans approximation jusqu'à obtenir exactement la même règle que l'oracle scalaire.
interpretation_fr: >-
  La tentative de vectorisation par grands lots a montré qu'une vectorisation plus large peut
  être plus lente à cause des allocations et du trafic mémoire. Cette régression est conservée
  dans la Chronicle et n'est pas masquée. La stratégie par préfixe exploite la structure du
  problème à faible FMR sans modifier l'estimateur.
remaining_gate_fr: >-
  Malgré l'accélération, les véritables lots complets de couverture statistique et de puissance
  statistique ne doivent pas être lancés : l'examen déterministe des quasi-doublons reste
  BLOCKED avec un cas 3/3 et un cas ambigu 2/3. Un projet d'amendement de quarantaine existe
  mais reste DRAFT et NON ACTIF jusqu'à revue et GO humain explicite.
