summary: >-
  The frozen S3 x1.5 and x2.0 expanded-information designs both pass the synthetic
  known-truth coverage revalidation gate at the first preregistered checkpoint of 1000
  simulated datasets per scenario and per design. The combined machine-readable verdict is
  PASS. No escalation to the 2000 or 4000 checkpoints is admissible under the frozen
  first_checkpoint_where_all_cells_pass stopping rule. This result validates the bounded
  interval/estimator behavior on the two frozen expanded pair graphs; it is not evidence of
  real 512D-to-128D compression performance and opens no SCREEN, qualification TEST, or
  representation-geometry outcome.

