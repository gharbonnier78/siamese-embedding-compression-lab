  s4n1_best_gap_to_target: 0.0310
  s4n2_best_power: 0.8490
  s4n2_best_gap_to_target: 0.0510
  target_power: 0.90
  conditional_value_formula_s4n1: "0.0310 * C_miss"
  prospective_value_formula_s4n1: "q * 0.0310 * C_miss"
  conditional_value_formula_s4n2: "0.0510 * C_miss"
  prospective_value_formula_s4n2: "q * 0.0510 * C_miss"
  interpretation: >-
    These expressions measure the maximum expected missed-demonstration cost avoided if a future design
    could raise power exactly to 0.90 while leaving other decision risks unchanged. They are not estimates
    of product benefit and do not imply that additional evidence will achieve 0.90.

unknown_operational_inputs:
  q: prospective probability of an acceptable candidate state
  C_miss: cost of missing or delaying an actually acceptable compression
  C_extra_evidence: incremental cost of additional independent evidence
  alpha: separately calibrated false-qualification probability under adverse state
  C_false_pass: consequence of qualifying an unacceptable candidate
  fallback_policy: action after NOT_DEMONSTRATED
  reversibility: deployment rollback/recovery capability

