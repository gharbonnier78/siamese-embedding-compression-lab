interpretation_guardrails:
  - >-
    High coverage does not imply high power. A cautious interval can contain the truth very often
    while still being too wide or variable to establish non-inferiority often enough.
  - >-
    "Expected power" means the prospectively required 0.90 gate, not a theorem that DAGJK20 was
    expected to achieve 0.90.
  - >-
    Zero degeneracy means zero simulated datasets produced an invalid statistical calculation;
    it does not mean zero biometric errors.
  - >-
    S4N2 being lower-powered than S4N1 in this synthetic calibration does not mean the compressed
    model is worse; only the uncertainty/decision procedure changed.

