summary: >-
  The original S4 method-level seed-distribution question remains scientifically relevant,
  but it is no longer selected as the next primary Study 1B biometric qualification gate.
  The research progression has exposed two distinct objects that had been coupled: performance
  of a frozen compression artifact and stability of the stochastic training procedure across
  retraining realizations. Established biometric technology-evaluation references reviewed
  after the S3 negative result primarily evaluate submitted/frozen implementations under
  controlled protocols. The original S4 is therefore retained as a separate method-stability
  research question, while a new prospective S4 artifact-level design is opened for
  specification. This decision does not amend or activate the frozen Study 1B protocol and
  does not authorize any real outcomes.

