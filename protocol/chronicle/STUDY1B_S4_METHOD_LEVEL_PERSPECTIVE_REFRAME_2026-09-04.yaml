original_s4:
  source: protocol/simulations/STUDY1B_POWER_DESIGN_SENSITIVITY_V0_1_2026-08-31.yaml
  prior_status: SPECIFICATION_REQUIRED_BEFORE_EXECUTION
  prior_candidate_family:
    - hierarchical_seed_random_effects
    - predeclared_seed_quantile_functional
  scientific_object: >-
    A population-level statement about the stochastic compression training procedure across
    repeated seed realizations, with seed instability explicitly modeled.
  current_disposition: RETAIN_AS_SEPARATE_METHOD_STABILITY_STUDY_NOT_PRIMARY_STUDY1B_GATE
  rationale: >-
    The question is valid, but it is a different estimand from performance of a frozen
    submitted artifact. Keeping it as the primary blocking gate would continue to couple
    algorithm-development reproducibility with biometric technology evaluation. With only five
    predeclared seeds, strong population-of-training-runs claims would also rely materially on
    additional distributional assumptions that require their own study.

