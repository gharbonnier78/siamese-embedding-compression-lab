    d128_total_gallery_payload_GB: 39.168
    avoided_GB: 117.504
  hybrid_quarter_whitelist_50_devices:
    d512_total_gallery_payload_GB: 41.472
    d128_total_gallery_payload_GB: 10.368
    avoided_GB: 31.104
  note: >-
    These are physical-copy sensitivity values, not an assertion that Jungle Championship deploys
    50 devices or uses the stated gallery-routing fractions.

matching_work_proxy:
  local_gallery_payload_formula: "((N * g_i) + B) * T * d * b"
  brute_force_coordinate_work_formula: "v_i * (((N * g_i) + B) * T) * d"
  event_wide_proxy: "sum_i v_i * (((N * g_i) + B_i) * T_i) * d"
  invalid_naive_model: "people * cameras"
  caveat: >-
    Coordinate counts are structural arithmetic proxies only. They do not predict measured latency,
    throughput, energy or accelerator utilization when indexing, ANN search, batching, SIMD, memory
    hierarchy or fixed overhead are material.

C_miss_implication:
  storage_only_interpretation_rejected: true
  possible_engineering_value_categories:
    - edge RAM/cache fit
    - physical gallery replication footprint
    - gallery synchronization payload
    - dense coordinate-level matching work
    - offline autonomy
    - freedom to replicate security-relevant lists more broadly
    - possible hardware/capacity headroom if demonstrated by engineering measurements
  caveat: >-
    These categories become numerical C_miss inputs only when measured or supplied with provenance.
    The matrix itself does not claim financial, latency, energy or production benefit.

open_engineering_inputs:
  - actual edge-device count and topology by zone
  - actual whitelist routing fractions g_i
  - local observation flows v_i and peak loads
  - actual templates per identity
  - actual embedding datatype / encoding
  - actual blacklist cardinality and update cadence
  - whitelist registration and refresh cadence
  - edge RAM/storage/compute constraints
  - unmatched portrait format and retention policy
  - network synchronization strategy
  - representative permitted 512D-vs-128D edge benchmark
  - cost and delay of genuinely independent additional biometric evidence

