summary: >-
  Quantify the archived Jungle Championship distributed-edge scenario without opening any protected
  Study 1B biometric outcome. The matrix preserves the separation between logical event identities,
  physical gallery copies, local observation flows and matching-work proxies. It calculates exact
  512D-to-128D vector-payload reductions and selected sensitivity envelopes while explicitly keeping
  device count, gallery routing, local flow, blacklist size, templates, datatype and economic values
  as scenario parameters until supplied by engineering authority.

human_authority:
  source: "2026-09-07 project conversation"
  instruction: "Ok"
  interpretation: >-
    Authorization to continue the previously declared next step: construct the Jungle Championship
    edge scenario matrix and archive the resulting non-outcome engineering analysis.

scenario_facts_preserved:
  event_duration_days: 5
  matches_per_day: 3
  total_matches_derived: 15
  stadium_capacity: 50000
  max_spectator_admissions_if_full_derived: 750000
  repeat_attendance_expected: true
  whitelist_semantics: >-
    authorized spectators, technical staff, organizing staff and numerous contractors/subcontractors
  blacklist_semantics: >-
    restricted stadium-ban list, potentially extended with nationally/internationally wanted persons
  unmatched_semantics: >-
    retain portrait, location and timestamp for later national offline 1:N identification
  edge_distribution_semantics: >-
    identities are not unique to one device and people do not pass in front of every device; local
    flows are heterogeneous and physical gallery copies are distinct from logical identities.

provenance_classes:
  user_provided: direct scenario values and semantics from human authority
  derived: arithmetic consequences of user-provided values
  scenario: sensitivity values introduced only for bounded engineering analysis

sensitivity_grid:
  whitelist_unique_identities: [250000, 500000, 750000, 1000000]
  blacklist_identities: [1000, 10000, 100000]
  templates_per_identity: [1, 3, 5]
  embedding_dimensions: [512, 128]
  datatypes:
    FP32_bytes_per_component: 4
    FP16_bytes_per_component: 2
    INT8_bytes_per_component: 1
  device_counts_for_replication_sensitivity_only: [10, 50, 100]
  hybrid_whitelist_fractions_for_sensitivity_only: [0.25, 0.10]

exact_structural_results:
  dimension_ratio_128_over_512: 0.25
  vector_payload_reduction_same_dtype_encoding: 0.75
  dense_coordinate_count_reduction_fixed_gallery: 0.75
  per_vector_bytes:
