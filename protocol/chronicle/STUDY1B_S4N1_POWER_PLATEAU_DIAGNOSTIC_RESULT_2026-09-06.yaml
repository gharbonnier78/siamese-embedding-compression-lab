summary: >-
  The frozen post-closure analysis of the archived S4N1 synthetic power shards confirms that the
  approximately 0.869 power plateau at true TEST Delta_FNMR 0.01 is not primarily explained by
  point-estimator bias or by the frozen artifact selector. The selected-artifact point estimator
  is nearly unbiased, selector power differs by only 0.004, while the existing UCB97.5 headroom
  is materially wider than the empirical repeated-sampling upper error in the known-truth
  generator. This is evidence of conservative uncertainty spread under this synthetic design,
  not permission to narrow the interval post hoc. S4N1 remains CLOSED_NEGATIVE.

