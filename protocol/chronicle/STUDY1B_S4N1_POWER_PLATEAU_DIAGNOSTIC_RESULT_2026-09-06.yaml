between_selector_result:
  power_range_true_delta_0_00: 0.00075
  power_range_true_delta_0_01: 0.004
  interpretation: >-
    The maximum power difference among selectors at Delta_FNMR 0.01 is 0.4 percentage point,
    far smaller than the gap to the frozen 0.90 gate. Selector choice is therefore not identified
    as the primary proximate driver of the plateau.

mechanism_diagnosis:
  point_estimator: >-
    Mean TEST point-estimation error at Delta_FNMR 0.01 is between approximately -0.00005 and
    -0.00010 across selectors, with repeated-sampling SD approximately 0.0051. The plateau is not
    explained by a material point-estimator bias under the frozen generator.
  uncertainty_spread: >-
    The median UCB97.5-minus-point headroom is approximately 0.0140 whereas the empirical 97.5th
    percentile of point-estimation error is approximately 0.0098 to 0.0101. The diagnostic ratio
    is approximately 1.39 to 1.43. One-sided upper coverage is approximately 99.6 to 99.75 percent,
    well above a 97.5 percent target. Under this known-truth generator the current bootstrap upper
    bound therefore behaves conservatively enough to materially reduce power.
  amount_of_change_needed_only_as_diagnostic: >-
    Scaling the existing UCB headroom to roughly 94.1 to 94.6 percent of its present value would
    have moved the archived synthetic pass rate to 90 percent. Under a pure 1/sqrt(information)
    heuristic this corresponds to only about 1.12 times effective information. This is not a
    prospective sample-size result and cannot be used to alter S4N1.
  oracle_check: >-
    A parity-split known-truth repeated-sampling oracle gives held-out upper coverage of about
    96.8 to 97.35 percent and held-out NI power of about 97.4 to 97.8 percent. This shows that the
    archived generator contains enough repeated-sampling information for a materially tighter
    upper uncertainty statement in principle. The oracle uses known synthetic truth and is not an
    admissible real-data inference method.

scientific_conclusion: >-
  S4N1's negative result is preserved. The post-closure diagnosis localizes the next methodological
  question: improve the efficiency/calibration of selected-artifact TEST uncertainty estimation,
  or add enough genuinely independent identity-level information, while preserving the operating
  point, 97.5 percent one-sided protection, identity dependence, and untouched TEST semantics.
  Merely switching to an observed UCB95, reducing confidence, or choosing the least-failing
  selector is prohibited post hoc.

next_action:
  action: DESIGN_AND_FREEZE_PROSPECTIVE_S4N2
  design_question: >-
    Can a prospectively justified uncertainty estimator and/or a prospectively increased amount
    of independent identity-level information achieve calibrated one-sided selected-artifact TEST
    coverage with at least 0.90 power at true Delta_FNMR 0.01, without relaxing the Study 1B
    operating-point or non-inferiority claim?

