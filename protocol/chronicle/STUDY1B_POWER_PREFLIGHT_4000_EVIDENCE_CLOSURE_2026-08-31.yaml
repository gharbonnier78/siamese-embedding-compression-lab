pedagogical_reading:
  en_francais_dans_le_texte: >-
    Le dossier de puissance est maintenant ferme. Le calcul a ete execute
    completement et son resultat officiel est conserve, meme s'il est negatif.
    Il passe quand la vraie degradation vaut 0, mais il ne donne que 38,725%
    de chances de faire passer simultanement les cinq seeds quand la vraie
    degradation vaut +0,01, alors que nous avions exige au moins 90%. Nous ne
    recommencons donc pas le meme calcul jusqu'a obtenir un vert: nous gardons
    le rouge comme information scientifique et nous revenons au dimensionnement
    de l'experience avant d'ouvrir les vrais resultats.
  lecture_ingenieur: >-
    Le gate de puissance est une qualification du dispositif de decision, pas
    du produit compresse. L'evidence package fixe run, commit, artefact, digest,
    parametres et verdict. Un FAIL reproductible devient un input de conception:
    il impose une boucle d'amendement pre-outcome, avec analyse de sensibilite,
    revue independante et nouvelle freeze. Les workflows lourds passent en
    replay manuel pour proteger l'unicite de la preuve de reference.
  lecture_12_ans: >-
    On avait decide avant le test la note minimale pour reussir. Le test a ete
    fait correctement, mais une partie importante a rate. On garde cette copie
    telle quelle: on ne refait pas le controle encore et encore pour esperer une
    meilleure note. On cherche d'abord pourquoi l'exercice est mal dimensionne,
    puis on prepare une nouvelle version avant de regarder les vraies reponses.
