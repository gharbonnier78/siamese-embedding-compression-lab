      - workflow:32754557695:Study-1A-Checkpoint-E2-Equivalence-Probe:success
      - artifact:9530398999
      - artifact_sha256:180fbd78c8cd303cb8ac952eeba8a551b64b74197aaced3b90abc9c686928420
