  - id: CHRON-20260824-S1A-007
    recorded_at_utc: "2026-08-24T17:15:00Z"
    kind: architecture_and_preprocessing_equivalence_hypothesis
    status: OPEN_REQUIRES_DIRECT_PROOF
    outcome_evidence_seen: false
    scientific_outcomes_opened: false
    summary: >-
      The downloaded historical mirror and author-HF safetensors both expose 49 residual body
      blocks (indices 0..48), matching AdaFace IR101/R100 block units [3,13,30,3] and not IR50
      [3,4,14,3]. The remaining backbone-value mismatch is localized to the first convolution.
      This materially reduces the IR50-mislabel risk for the exact safetensors artifact used by
      the probe, but does not by itself prove scientific equivalence.
    exact_reference_policy:
      preregistered_model_identity: "AdaFace R100 / WebFace12M"
      original_locator_google_drive_file_id: "1dswnavflETcnAuplZj1IOKKP0eM8ITgT"
      original_code_protocol_ref: "c60eaa786a42c03444f3df7096dbaf9d57ae010d"
      historical_mirror_sha256: "0e7a3238d2a50f3fe3860782534928ac7cb2598977cf897f6869fd5ac2493fd0"
      author_hf_repo: "minchul/cvlface_adaface_ir101_webface12m"
      author_hf_file: "model.safetensors"
      author_hf_sha256: "2ea535a43877bd3de8091903935c783ce335be66a9f8917fae9a7a18ae4bbf56"
      rule: >-
        Any Study 1A outcome must record the exact artifact SHA, source revision/locator,
        architecture fingerprint, and input color/preprocessing contract. A model label alone
        is not an admissible reference.
    architecture_fingerprint:
      historical_mirror_body_blocks: 49
      author_hf_body_blocks: 49
      expected_ir101_body_blocks: 49
      expected_ir50_body_blocks: 24
      current_interpretation: "IR101/R100 structure supported for both probed artifacts"
    historical_extra_tensors:
      - head.batch_mean
      - head.batch_std
      - head.kernel
      - head.t
    historical_extra_tensor_interpretation: >-
      These four tensors belong to the training/classification head rather than the frozen
      inference backbone and explain the 921-versus-917 tensor-count difference. They are not
      evidence of an IR50 backbone.
    preprocessing_risk_hypothesis:
      original_adaface_contract: "BGR 112x112 normalized with mean=0.5 std=0.5"
      author_hf_contract: "RGB 112x112 according to CVLFace/Hugging Face config"
      observation: >-
        Exactly one backbone tensor differs and it is the first [64,3,3,3] convolution. A
        red-blue input-channel permutation is therefore a plausible deterministic conversion
        hypothesis, but it has not yet been tested directly.
      risk_if_wrong_preprocessing_is_used: >-
        Embeddings can change from the first layer onward, invalidating direct comparison to
        the published AdaFace reference metrics and potentially changing Gate A outcomes.
    internet_refs:
      - https://github.com/mk-minchul/AdaFace
      - https://github.com/mk-minchul/AdaFace/blob/master/inference.py
      - https://huggingface.co/minchul/cvlface_adaface_ir101_webface12m/blob/main/config.json
      - https://huggingface.co/minchul/cvlface_adaface_ir101_webface12m/blob/main/pretrained_model/model.yaml
      - https://github.com/mk-minchul/CVLface/issues/39
    issue_39_scope_note: >-
      CVLFace issue #39 is an unresolved user report that links pretrained_model/model.pt.
      It has no maintainer reply and is not proof that the exact hash-pinned model.safetensors
      artifact is IR50. The local 49-block fingerprint is stronger direct evidence for the
      exact artifact under study.
    next_action: >-
      Run a bounded non-outcome-bearing conversion probe that tests all six input-channel
      permutations on the first convolution, with particular attention to RGB<->BGR reversal.
      If one permutation makes the first convolution exactly identical and all 916 remaining
      inference-backbone tensors are already exact, document the deterministic preprocessing
      transformation and request technical review of E2 equivalence under the declared
      lossless representation rule. Do not open benchmark outcomes to decide this.

