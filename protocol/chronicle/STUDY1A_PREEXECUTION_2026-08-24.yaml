  - id: CHRON-20260824-S1A-004
    recorded_at_utc: "2026-08-24T16:44:54Z"
    kind: provenance_risk_discovery
    status: OPEN
    summary: >-
      A public upstream CVLFace issue reports that the Hugging Face repository labelled
      ir101 may expose an IR50 model. Therefore repository/model naming is insufficient to
      establish the required R100 / ir_101 backbone identity.
    evidence_refs:
      - https://github.com/mk-minchul/CVLface/issues/39
      - https://github.com/mk-minchul/AdaFace/blob/c60eaa786a42c03444f3df7096dbaf9d57ae010d/net.py
      - https://github.com/mk-minchul/AdaFace/blob/c60eaa786a42c03444f3df7096dbaf9d57ae010d/validation_hq/eval_5valsets.sh
    architecture_reference:
      expected_label: ir_101
      expected_adaface_backbone_num_layers: 100
      expected_block_units: [3, 13, 30, 3]
      contrasting_ir50_block_units: [3, 4, 14, 3]
    next_action: >-
      Require an architecture fingerprint proving IR101/R100 compatibility in addition to
      artifact and tensor identity checks.

