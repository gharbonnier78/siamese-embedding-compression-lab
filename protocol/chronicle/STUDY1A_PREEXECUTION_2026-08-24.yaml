        filename: model.safetensors
        size_bytes: 260980552
        sha256: 2ea535a43877bd3de8091903935c783ce335be66a9f8917fae9a7a18ae4bbf56
    measured_engineering_result:
      historical_tensor_count: 921
      author_hf_tensor_count: 917
      author_hf_exact_tensor_coverage_in_historical_checkpoint: 0.9989094874591058
      author_hf_shape_dtype_coverage_in_historical_checkpoint: 1.0
      exact_name_matches: 0
      exact_name_and_value_matches: 0
      e2_status: NOT_PROVEN
      unsafe_pickle_fallback_used: false
    localized_difference:
      author_hf_key: model.net.input_layer.0.weight
      historical_mirror_key: model.input_layer.0.weight
      shape: [64, 3, 3, 3]
      dtype: torch.float32
      author_hf_tensor_sha256: 36949c1b290a1d82bcc5badd7652825f033255abab40f85810a11a000dbde200
