interpretation:
  - >-
    The full 4000-dataset reanalysis confirms that the all-five-seed
    intersection is the dominant source of power loss at true delta=0.01.
  - >-
    Individual seed pass probabilities at delta=0.01 are approximately
    0.780-0.800, while the preregistered all-5-of-5 rule succeeds only 0.38725.
  - >-
    The median worst-seed UCB at delta=0.01 is 0.0316569655, already above the
    0.03 non-inferiority margin, explaining why the joint rule often fails.
  - >-
    Alternative 3-of-5 and 4-of-5 rates are post-failure diagnostics only;
    they were not preregistered and must not be reported as Study 1B outcomes
    or adopted without a prospective amendment and independent review.
  - >-
    At delta=0, the original 5-of-5 rule remains above the required 0.90 power
    target at 0.9345, consistent with the canonical power preflight verdict.

scientific_boundary:
  what_this_supports:
    - The original power failure at delta=0.01 is reproducibly explained on the full canonical simulation set.
    - Seed-level decisions are much less restrictive than the five-seed intersection.
    - A prospective design amendment may legitimately study the scientific meaning of the seed aggregation rule.
  what_this_does_not_support:
    - Changing the primary decision rule retroactively.
    - Claiming 3-of-5 or 4-of-5 as successful Study 1B gates.
    - Any conclusion about actual random128, PCA128 or Siamese128 performance versus raw512.

