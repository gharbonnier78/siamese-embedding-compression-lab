findings_recorded:
  factual_correction:
    id: EDGE_LLC_RANGE_CORRECTION
    superseded_claim: >-
      Edge last-level caches range from 4 to 32 MB, so gallery G0 (61.44 MB at 512D, 15.36 MB at 128D) brackets that
      range and separates a cache-resident 128D arm from a DRAM-bound 512D arm.
    origin_of_superseded_claim: drafting assistant training data, not a source
    verified_llc_capacity_MB:
      raspberry_pi_5_bcm2712: 2
      jetson_orin_nano_per_cpu_cluster: 2
      intel_n100: 6
    consequence: >-
      No G0 arm is cache-resident on any of the three documented edge platforms. G0 differs from G2 in magnitude, not
      in regime, and the SMALL_WORKING_SET_CONTROL role does not separate cache from DRAM on this hardware. A genuinely
      cache-resident control would need about 4000 vectors at 128D or 1000 at 512D for 2 MB.
  source_hygiene:
    id: AI_SUMMARY_IS_NOT_A_SOURCE
    observation: >-
      While searching for the Intel ARK sheet of the N100, the first result was an AI-generated summary of an archived
      ARK page. It attributed dual- and triple-channel memory, Hyper-Threading and ECC to the N100, contradicted by all
      other sources, which describe a 4-core, 4-thread, single-channel part.
    rule_adopted_in_chapter: automatic summaries of primary sources and assistant statements are excluded as sources
  contract_coverage_method:
    id: COVERAGE_MUST_FIRST_ESTABLISH_WHICH_ARTIFACT_EACH_TEST_OPENS
    observation: >-
      No test opens STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_2026-09-08.yaml. A first coverage estimate
      based on key names produced false positives because homonymous keys exist in other artifacts.
  first_order_model:
    operational_intensity_unbatched_exact_scan: 0.5 operations per byte, independent of dimension
    null_hypothesis: latency ratio of exactly 4x while both arms are memory-bound
    interpretation: any measured deviation from 4x signals cache residency, backend dispatch or thermal throttling
    effective_bandwidth_efficiency_used: "0.70"
    effective_bandwidth_efficiency_nature: ASSUMED_NOT_MEASURED
  new_coupling_tier_bandwidth:
    observation: Jetson Orin Nano 4 GB has 34 GB/s peak memory bandwidth against 68 GB/s for 8 GB
    consequence: a lower RAM tier may also halve bandwidth; tier advantage must be evaluated at the target tier bandwidth
  new_coupling_battery_enclosure:
    observation: typical Li-ion charge window 0 to 45 C, discharge -20 to 60 C, no charging below freezing
    consequence: in a sealed enclosure heated by the SoC, a mobile unit may leave its charge window from above in summer
  forgotten_dimensioning_hypotheses:
    D12_batching_policy:
      finding: phase_a_search_semantics does not fix a batching policy; the word does not appear in benchmark v0.3
      mechanism: batching B queries multiplies operational intensity by B and can move every saturation point by an order of magnitude
      recommendation: >-
        Server scenario without batching as primary, Offline scenario with a frozen batch size as declared secondary;
        dynamic batching deferred to a deployment phase because its wait parameter would itself need freezing.
      status: PROPOSED_NOT_ADOPTED
    D13_arrival_process:
      finding: benchmark v0.3 uses deterministic arrivals; the MLPerf Server scenario uses Poisson arrivals
      mechanism: M/D/1 mean wait is rho/(2(1-rho)) service times against zero for D/D/1 below capacity
      recommendation: keep deterministic arrivals canonical and add a Poisson variant with a frozen seed at the same mean rates
      status: PROPOSED_NOT_ADOPTED
    D14_requests_per_passage:
      finding: the load grid is in requests per second, the scenario in passages; no conversion is written
      recommendation: one request per passage from best-frame selection as canonical, with a sensitivity at k detections
      status: PROPOSED_NOT_ADOPTED_VALUES_TO_BE_DECLARED
  product_question:
    id: EQUAL_BYTES_COMPARISON
    fact: 512D INT8 and 128D FP32 both occupy 512 bytes per vector
    consequence: the RAM and tier argument for 128D can be obtained by quantization alone
    recommendation: >-
      Compare representations at equal bytes in a future biometric protocol identity, including a 512D INT8 route.
      Study 1B is not modified.
    status: PROPOSED_NOT_ADOPTED
  regulatory_facts:
    legal_advice: false
    iec_62471: horizontal photobiological safety standard for incoherent sources including LEDs, 200 to 3000 nm
    gdpr_article_9: processing of biometric data for unique identification prohibited in principle, with exceptions
    eu_ai_act_article_5_1_h: >-
      real-time remote biometric identification in publicly accessible spaces for law enforcement prohibited in
      principle, with narrow exceptions
    consequence: >-
      The access-control branch and the watchlist branch may fall under different legal regimes if deployment is in the
      EU. Jurisdiction and operator per branch are scenario parameters to declare before dimensioning each branch.
  sequencing:
