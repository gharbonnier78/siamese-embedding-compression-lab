pedagogical_reading:
  en_francais_dans_le_texte: >-
    Les donnees etaient bien preparees et telechargees, mais le fichier de paires TEST n'etait
    pas range exactement la ou le script le cherchait. On ne change donc ni l'experience ni les
    statistiques: on apprend au workflow a retrouver ce fichier dans l'artefact telecharge, puis
    on relance les memes calculs.
  lecture_ingenieur: >-
    Le producer et le consumer de l'artefact n'avaient pas le meme contrat de chemin relatif.
    Le producer etait valide; le consumer utilisait un chemin absolu dans l'arborescence de travail.
    La correction rend le binding de l'artefact robuste tout en restant fail-closed et sans toucher
    aux invariants scientifiques.
  lecture_12_ans: >-
    Imagine qu'on a bien mis le bon cahier dans un carton, mais qu'apres livraison le carton a ete
    range dans une autre etagere. Au lieu de refaire le cahier, on cherche ou il est dans le carton,
    on verifie qu'on l'a trouve, puis on continue exactement le meme exercice.
next_gate:
  requirement: >-
    At least one coverage shard must reach the simulation loop and produce JSONL dataset rows
    before any statistical progress is claimed.
