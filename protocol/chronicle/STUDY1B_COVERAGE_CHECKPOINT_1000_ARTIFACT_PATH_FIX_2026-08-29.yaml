correction:
  workflow: .github/workflows/study1b-coverage-checkpoint.yml
  method: >-
    Resolve test_pairs.csv deterministically inside the downloaded artifact tree using find,
    fail closed if exactly no candidate is found, print the resolved path, and pass that path
    to the unchanged Study 1B simulation runner.
  changes_to_protocol: none
  changes_to_rng_or_seeds: none
