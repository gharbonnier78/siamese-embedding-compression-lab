      first_run_result: INFRASTRUCTURE_FAILURE_BEFORE_SIMULATION
      failure_stage: prepare-test-graph/materialize-active-amended-boundary
      failure_reason: >-
        The coverage workflow passed the KaggleHub archive root directly to the active-boundary
