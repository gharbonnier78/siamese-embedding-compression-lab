    pedagogical_reading:
      en_francais_dans_le_texte: >-
        Avant de mesurer si la compression 512D vers 128D fonctionne vraiment, on vérifie d'abord
        que notre outil statistique sait donner une réponse fiable. Pour cela, on fabrique beaucoup
        de jeux de données synthétiques où la vérité est connue à l'avance. La couverture statistique
        demande : quand on construit un intervalle de confiance censé contenir la vraie valeur dans
        environ 95 % des cas, est-ce qu'il la contient réellement assez souvent ? Ici, on exige une
        preuve prudente : la borne basse exacte de Clopper-Pearson sur cette fréquence doit être au
        moins 0,93. La puissance statistique pose une autre question : si une méthode est réellement
        non inférieure avec un écart vrai de 0 ou 0,01, notre procédure complète — y compris les cinq
        graines de modèle — a-t-elle au moins 90 % de chances de conclure correctement que la borne
        supérieure reste sous la marge de 0,03 ? Ces simulations n'utilisent aucun résultat biométrique
        SCREEN ou TEST ; elles valident la règle de décision avant d'autoriser l'expérience réelle.

      lecture_ingenieur: >-
        On qualifie ici la chaîne de mesure avant de qualifier le produit scientifique. Le graphe TEST
        figé fournit la topologie d'échantillonnage, mais les distances sont synthétiques et générées
        sous des régimes dont le Delta_FNMR vrai est imposé. Le bootstrap par slots d'identités
        reproduit la dépendance induite par les sujets : une arête genuine porte le poids m_i et une
        arête imposteur m_i*m_j. Pour la couverture, on répète l'expérience synthétique 1000 fois au
        premier checkpoint, puis éventuellement 2000 et 4000, et on contrôle à la fois la fréquence de
        couverture et le taux de réplications dégénérées. Pour la puissance, un dataset simulé représente
        un même monde de référence raw512 partagé par les cinq seeds candidats ; seules les réalisations
        résiduelles des candidats varient avec les seeds. Cela correspond à un essai apparié avec un
        comparateur commun, et évite d'ajouter artificiellement cinq réalisations indépendantes du même
        système de référence. Tant que cette chaîne ne passe pas ses gates, SCREEN/TEST restent fermés.

      lecture_12_ans: >-
        Imagine un thermomètre qu'on veut utiliser pour une expérience importante. Avant de mesurer la
        vraie expérience, on le teste avec des températures qu'on connaît déjà. Si on lui demande
        beaucoup de fois de donner une zone où devrait être la bonne température, la bonne température
        doit presque toujours tomber dans cette zone. C'est la couverture. Ensuite on vérifie qu'il est
        assez sensible pour voir une petite différence quand elle existe vraiment : c'est la puissance.
        Ici, on fait la même chose avec notre méthode statistique. On crée des faux jeux de données dont
        on connaît la réponse, on vérifie que nos intervalles disent vrai assez souvent, puis qu'avec cinq
        versions légèrement différentes du modèle on arrive encore à prendre la bonne décision au moins
        9 fois sur 10. Ce n'est qu'après qu'on regardera les vraies performances réservées de Study 1B.

