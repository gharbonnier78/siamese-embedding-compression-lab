    power_pairing_correction:
      status: IMPLEMENTED_PREOUTCOME
      purpose: >-
        Preserve the matched Study 1B design in planning simulations by using one common
        synthetic raw/reference realization per simulated dataset across all five candidate
        model seeds, while retaining seed-specific candidate residual variation.
      rationale: >-
        The reference route is one common comparator in the real matched experiment. Simulating
        an independent reference world for each candidate seed would inject variance that does
        not belong to the design and could distort the estimated all-five-seed power.
      outcome_data_used_to_choose_change: false

    coverage_checkpoint_1000:
