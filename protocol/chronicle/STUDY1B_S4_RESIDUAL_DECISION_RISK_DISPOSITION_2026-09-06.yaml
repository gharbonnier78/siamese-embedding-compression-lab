  s4n2_best_power: 0.8490
  s4n1_best_non_demonstration_probability: 0.1310
  s4n2_best_non_demonstration_probability: 0.1510
  target_non_demonstration_probability: 0.10

scientific_interpretation:
  - >-
    The excess non-demonstration probability is a study-level Type-II decision risk under the frozen
    synthetic truth. It is not person-level FMR/FNMR risk and is not evidence about the unopened real
    compressed candidate.
  - >-
    Under a conservative fallback in which NOT_DEMONSTRATED retains raw512, the dominant consequence
    of lower power is expected opportunity cost or qualification delay, not a directly inferred biometric
    safety loss.
  - >-
    The completed 0.90 gate may not be lowered retroactively. A future power requirement may only be
    justified prospectively from explicit decision consequences and evidence economics.

current_disposition:
  s4n3_estimator_search: STOP_FOR_NOW
  reason: >-
    Continuing solely because S4N1 and S4N2 missed 0.90 would risk post-hoc method shopping. Any future
    S4N3 would require an independently motivated methodological hypothesis and a new prospective freeze.
  next_workstream: residual_decision_risk_and_value_of_information
  next_required_inputs:
    - PASS action
    - NOT_DEMONSTRATED fallback action
    - validity of raw512 fallback
    - engineering value of an acceptable 128D adoption
    - cost/delay of additional independent evidence
    - false-qualification consequence
    - reversibility and operational criticality

