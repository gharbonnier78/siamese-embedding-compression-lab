summary: >-
  Following prospectively frozen negative S4N1 and S4N2 power results, stop the estimator-search
  path for now rather than opening an opportunistic S4N3. Preserve the 0.90 requirement as binding
  for the completed S4N1/S4N2 campaigns, but do not interpret it as an established product-safety
  boundary. Move the next authorized non-outcome work to residual decision-risk, fallback-policy,
  and value-of-information analysis. No real Study 1B outcome is opened by this disposition.

