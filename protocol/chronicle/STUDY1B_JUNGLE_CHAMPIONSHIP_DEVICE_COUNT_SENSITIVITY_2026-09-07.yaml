next_action: >-
  Use D=50 as the central planning sensitivity and D={25,100} as low/high bounds until an engineering
  topology is supplied. Prioritize determining whether 512D versus 128D crosses a real device RAM/storage
  or offline-architecture threshold before assigning an economic memory value.
