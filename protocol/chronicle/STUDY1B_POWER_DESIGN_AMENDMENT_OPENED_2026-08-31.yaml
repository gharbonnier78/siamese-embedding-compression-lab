pedagogical_reading:
  en_francais_dans_le_texte: >-
    Nous avons appris que la regle actuelle manque de puissance. La bonne reaction
    n'est pas de choisir immediatement une regle plus facile, mais de comparer les
    causes possibles avec des donnees synthetiques ou la verite est connue. Les
    vrais resultats 128D contre raw512 restent fermes pendant cette etude.
  lecture_ingenieur: >-
    Le FAIL devient une entree de conception experimentale. Nous decomposons la
    fonction de decision en quatre leviers: aggregation des seeds, variabilite des
    seeds, largeur d'incertitude et information independante. Toute modification
    finale devra etre justifiee par calibration, pas par optimisation post-hoc.
  lecture_12_ans: >-
    Le premier jeu etait trop difficile. On ne regarde pas encore le vrai match.
    On essaie plusieurs regles sur des matchs inventes dont on connait deja le score
    correct, puis on demande a des arbitres de verifier la nouvelle regle avant de
    l'utiliser pour de vrai.
