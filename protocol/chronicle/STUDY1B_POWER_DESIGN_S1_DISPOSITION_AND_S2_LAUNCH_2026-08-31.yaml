candidate_space_narrowing:
  A_frozen_all_five:
    disposition: RETAIN_AS_REFERENCE_ONLY
    reason: >-
      It preserves strongest worst-seed semantics but canonical power at delta=0.01
      is 0.38725, so it cannot be activated unchanged for the intended >=0.90 power claim.
  B_k_of_five:
    disposition: RETAIN_FOR_SEED_VARIABILITY_SENSITIVITY_ONLY
    reason: >-
      At the original seed-effect SD=0.005, 4/5 gives 0.7055 and 3/5 gives 0.8885.
      Neither satisfies the >=0.90 selection gate. The 3/5 rule is close enough to
      justify prospective sensitivity to the seed-variability assumption, but this
      post-failure reanalysis does not authorize it.
  C_method_level_seed_distribution:
    disposition: DEFER_UNTIL_AFTER_S2
    reason: >-
      A new estimator should not be introduced unless S2 shows that explicit
      seed-distribution modelling is needed and defensible.
  D_more_information_same_rule:
    disposition: DEFER_TO_S3_AFTER_S2
    reason: >-
      Information expansion is potentially valid only if genuinely independent or
      meaningfully distinct observations exist; S2 first isolates the seed-model effect.
  E_accept_low_power:
    disposition: RETAIN_AS_VALID_STOP_CONTROL

