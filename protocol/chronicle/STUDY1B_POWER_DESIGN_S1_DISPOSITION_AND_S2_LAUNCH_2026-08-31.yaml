interpretation_guardrails:
  - S2 is prospective synthetic design analysis, not a Study 1B performance result.
  - S2 cannot replace the canonical failed power run.
  - A pilot cell below 0.80 is not expanded to 4000 under the frozen sensitivity contract.
  - A pilot cell at or above 0.80 is only eligible for further calibration; it is not accepted automatically.
  - Any changed decision rule or estimator requires fresh known-truth coverage validation before activation.
  - No SCREEN or TEST outcome may be opened from this milestone.

pedagogical_reading:
  en_francais_dans_le_texte: >-
    Le diagnostic complet confirme que le probleme vient en grande partie de la
    combinaison de cinq seeds: chacun passe souvent seul, mais demander que les cinq
    passent ensemble fait chuter fortement la probabilite de succes. La regle 3/5
    arrive a 88,85% a delta=0,01, donc meme elle ne franchit pas notre seuil de 90%.
    On ne la choisit pas pour autant. On teste maintenant, sur des donnees simulees,
    a quel point cette conclusion depend de notre hypothese de variabilite entre seeds.
  lecture_ingenieur: >-
    S1 ferme une premiere branche de conception: aucun simple k-of-5 observe au
    SD=0,005 ne satisfait le gate >=0,90 a delta=0,01. S2 devient donc une analyse de
    sensibilite d'hypothese, pas une optimisation de seuil. Elle maintient constants
    FMR, marge NI, UCB 97,5%, bootstrap et graphe TEST, et ne varie que le SD de l'effet seed.
  lecture_12_ans: >-
    On a essaye de compter combien d'eleves doivent reussir sur cinq. Meme trois sur
    cinq n'atteignent pas tout a fait notre objectif. Avant de changer la regle du jeu,
    on verifie maintenant si on avait imagine les eleves trop differents les uns des autres.
