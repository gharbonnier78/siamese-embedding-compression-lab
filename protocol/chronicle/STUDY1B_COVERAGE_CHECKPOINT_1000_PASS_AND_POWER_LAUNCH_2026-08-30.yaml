pedagogical_reading:
  en_francais_dans_le_texte: >-
    On vient de vérifier notre règle de mesure, pas la qualité de la compression. On a fabriqué
    des expériences où la bonne réponse était connue à l'avance, puis vérifié que notre intervalle
    statistique retrouvait correctement cette réponse. Les cinq situations passent dès 1000 essais,
    donc la règle prévue nous dit de ne pas gaspiller du calcul avec 2000 puis 4000 essais de
    couverture. L'étape suivante est de vérifier que notre protocole a assez de puissance pour
    détecter la non-infériorité que nous voulons démontrer. Les vraies comparaisons 512D contre
    128D restent fermées.
  lecture_ingenieur: >-
    Le checkpoint coverage valide le sous-système de décision statistique indépendamment du
    système biométrique évalué. La chaîne identité-slot -> bootstrap apparié -> UCB -> décision de
    non-infériorité a été soumise à cinq régimes synthétiques de vérité connue. Chaque cellule
    satisfait la borne inférieure Clopper-Pearson préenregistrée et aucune dégénérescence n'est
    observée. Le gate coverage est donc fermé conformément à la règle d'arrêt. Le prochain risque
    méthodologique est un manque de puissance de la règle d'intersection sur cinq seeds; il est
    testé avant toute ouverture de SCREEN/TEST afin de ne pas confondre incapacité du protocole à
    conclure et performance réelle des représentations.
  lecture_12_ans: >-
    Imagine une règle graduée qu'on veut utiliser pour comparer deux objets. Avant de mesurer les
    vrais objets, on teste la règle avec des objets dont on connaît déjà exactement la taille. Si
    elle donne la bonne réponse presque tout le temps, on peut lui faire davantage confiance. Ici,
    la règle a réussi les cinq séries de tests. Maintenant on vérifie une autre chose: est-ce que
    notre expérience sera assez forte pour voir une petite différence si elle existe vraiment ?
    On n'a toujours pas regardé qui gagne entre la version 512 et les versions 128.

