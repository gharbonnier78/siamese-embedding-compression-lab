frozen_gate:
  estimand: delta_fnmr = FNMR_candidate - FNMR_raw512
  noninferiority_margin: 0.03
  one_sided_ucb_level: 0.975
  per_seed_pass_rule: ucb_97_5 < 0.03
  joint_rule: all_five_seeds_must_pass
