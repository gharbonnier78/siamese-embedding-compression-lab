  simulated_effects: [0.0, 0.01]
  rule_changed_after_observation: false

results:
  delta_0:
    simulated_datasets: 4000
    all_five_seed_passes: 3738
    estimated_power: 0.9345
    required_power: 0.90
    verdict: PASS
  delta_0_01:
    simulated_datasets: 4000
    all_five_seed_passes: 1549
    estimated_power: 0.38725
    required_power: 0.90
    verdict: FAIL
  overall_verdict: FAIL
  important_non_interpretation: >-
    These are operating characteristics of the statistical decision procedure
    under synthetic known-truth worlds. They are not observed compression
    performance and do not report random128, PCA128 or Siamese128 versus raw512.

causal_diagnostic:
  status: EXPLANATORY_DIAGNOSTIC_NOT_A_NEW_GATE
  conclusion: >-
    The failure is primarily consistent with the stacking of three conservative
    ingredients: a one-sided 97.5% UCB, only 0.02 of headroom between true
    delta=0.01 and the 0.03 margin, and the intersection rule requiring every
    one of five seed-specific UCBs to remain below the margin. Seed-to-seed
    heterogeneity further makes the worst seed materially closer to the margin.
  mechanisms:
    - id: reduced_margin_headroom
      explanation: >-
        At delta=0 the nominal distance to the NI margin is 0.03. At delta=0.01
        it is only 0.02 before seed effects and estimation uncertainty are added.
    - id: ucb_uncertainty_cost
      explanation: >-
        A diagnostic sample of the first 300 delta=0.01 simulated datasets
        showed the 97.5% UCB about 0.014 above the seed-specific true delta on
        average across the five seeds. This number is diagnostic, not a frozen
        gate statistic, but it explains why 0.02 headroom is fragile.
      diagnostic_sample:
        datasets: 300
        source_shards: [0, 1, 2]
        mean_ucb_minus_true_delta_approx: 0.0143
    - id: five_seed_intersection
      explanation: >-
        In the same 300-dataset diagnostic sample, individual seed pass rates
        were approximately 0.76 to 0.82 while the all-five pass rate was 0.37,
        close to the final 4000-dataset joint estimate of 0.38725. Requiring an
        intersection across five imperfectly correlated decisions compounds
        otherwise moderate per-seed failure probabilities.
      diagnostic_sample:
        individual_seed_pass_rate_range: [0.76, 0.8166666667]
        all_five_pass_rate: 0.37
        pairwise_pass_indicator_correlations: weak_positive_in_sample
    - id: worst_seed_effect
      explanation: >-
        Seed effects are drawn with SD 0.005 and clipped to [-0.02, 0.02]. With
        five seeds, the largest positive seed effect is often several thousandths.
        In the 300-dataset diagnostic sample its median was about 0.0059, moving
        the weakest seed from nominal delta=0.01 to roughly delta=0.0159 before
        sampling uncertainty. That leaves only about 0.0141 to the 0.03 margin,
        similar to the observed average UCB uplift.
      diagnostic_sample:
        median_max_positive_seed_effect: 0.00591773
        median_max_ucb_97_5: 0.03211405
        correlation_max_seed_effect_vs_max_ucb: 0.4919

scientific_interpretation:
  what_is_supported:
    - The implemented power design has adequate joint power at true delta=0.
    - The implemented power design does not have adequate joint power at true delta=0.01.
    - The loss of power is compatible with compounded uncertainty and the all-five-seed intersection rule.
  what_is_not_supported:
    - That the real compressed models are inferior or non-inferior to raw512.
    - That changing the NI margin, confidence level, seed count or all-five rule after this result is justified.
    - That the 300-dataset diagnostic sample replaces the preregistered 4000-dataset gate.

next_actions:
  - Preserve the failed power result as evidence; do not rerun unchanged expecting a different verdict.
  - Add a non-outcome diagnostic that aggregates marginal per-seed pass probabilities and the distribution of the worst-seed UCB across all 4000 datasets.
  - Quantify which design lever drives power loss by prospective sensitivity analysis only: sample size/pair count, uncertainty width, seed-effect SD, and joint decision rule.
  - Treat any proposed protocol modification as a new amendment requiring independent review and explicit human authorization before outcomes are opened.
  - Keep SCREEN and TEST outcomes closed.

pedagogical_reading:
  en_francais_dans_le_texte: >-
    Le thermometre statistique est bien calibre, mais notre experience est trop
    exigeante pour garantir 90% de reussite quand la vraie degradation vaut
    deja +0,01. Chaque seed doit non seulement rester sous la marge +0,03, mais
    sa borne haute d'incertitude doit elle aussi rester sous +0,03. Puis les cinq
    seeds doivent toutes reussir en meme temps. A delta=0 il reste beaucoup de
    marge et cela passe 93,45% du temps. A delta=0,01, l'incertitude et le seed
    le moins favorable consomment une grande partie des 0,02 restant: la regle
    complete ne passe plus que 38,725% du temps.
  lecture_ingenieur: >-
    Le systeme de decision est une chaine serie: estimation par seed -> UCB 97,5%
    -> comparaison a la marge NI -> intersection des cinq seeds. La fiabilite
    de la chaine est donc pilotee par le maillon le plus defavorable. Le monde
    delta=0.01 reduit de 33% le budget nominal entre l'effet et la marge par
    rapport a delta=0 (0,02 contre 0,03). La variabilite seed ajoute ensuite un
    worst-case local et l'UCB ajoute le budget d'incertitude. Le FAIL est donc
    un resultat de dimensionnement experimental, pas une panne de calcul.
  lecture_12_ans: >-
    Imagine cinq eleves qui doivent tous sauter une barre. Quand la barre est
    loin de leur limite, presque tout le groupe reussit. Si on rapproche la
    barre, chaque eleve peut encore souvent la passer, mais il suffit qu'un seul
    des cinq rate pour que le groupe entier soit compte comme rate. Ici notre
    regle demande justement cinq reussites sur cinq, avec en plus une marge de
    securite pour chaque saut.

