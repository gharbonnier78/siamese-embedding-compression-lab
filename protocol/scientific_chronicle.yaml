entries:
  - id: CHRON-20260808-001
    recorded_at_utc: "2026-08-08T07:47:00Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: cost_risk
    status: OPEN
    outcome_evidence_seen: false
    summary: >-
      The frozen production coverage design may be computationally impractical with the
      reviewed reference threshold implementation because weighted_threshold_at_fmr scans
      unique impostor distances in Python and repeatedly recomputes weighted sums.
    rationale: >-
      The production design nests 10,000 subject-bootstrap replicates inside up to 10,000
      simulated datasets across five scenarios. Runtime pressure must not silently cause a
      reduction of preregistered replicates, scenarios, stopping rules, or threshold semantics.
    evidence_refs:
      - src/siamese_compression_lab/subject_bootstrap.py
      - src/siamese_compression_lab/coverage_simulation.py
      - scripts/run_subject_bootstrap_coverage.py
      - protocol/coverage/study_0_subject_bootstrap_v0.2.2.yaml
      - protocol/studies/study_0_subject_bootstrap_spec.md
    considered_options:
      - benchmark_reference_implementation_at_small_non_outcome_scale
      - vectorize_threshold_computation_with_stable_sort_and_cumulative_weights
      - reduce_preregistered_simulation_scale
    rejected_or_constrained_options:
      - option: reduce_preregistered_simulation_scale
        reason: >-
          Runtime convenience alone is not a semantics-preserving implementation change and
          would require a versioned methodological amendment before execution.
    next_action: >-
      Benchmark the reviewed reference implementation, implement the vectorized threshold
      path if needed, and prove equivalence against the reviewed algorithm including tie
      blocks and sentinel behavior before production coverage execution.
    blocks:
      - production_coverage_gate

  - id: CHRON-20260808-003
    recorded_at_utc: "2026-08-08T14:33:00Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: decision
    status: RESOLVED
    outcome_evidence_seen: false
    summary: >-
      The production-coverage computational-feasibility blocker is resolved after measured
      profiling, deterministic dataset-level parallelism, sparse-edge pre-indexing, exact
      equivalence tests, and a direct benchmark at the frozen 10,000-replicate inner scale.
    rationale: >-
      The initial threshold-hotspot hypothesis was not supported at target FMR 0.01. Profiling
      instead justified dataset-level process parallelism and pre-indexing of the fixed sparse
      subject graph. The optimized path preserves the frozen weighting rule, SeedSequence RNG
      hierarchy, threshold/tie/sentinel semantics, estimands, and degenerate-replicate policy.
      CI and replay-equivalence tests are green. The direct frozen-inner benchmark at 10,000
      replicates per simulated dataset measured approximately 8.886 s/dataset with one worker,
      4.552 s/dataset with two workers, and 4.103 s/dataset with four workers on the recorded
      four-logical-CPU GitHub runner. This corresponds to approximately 4.94 h, 2.53 h, and
      2.28 h respectively for 2,000 datasets in one scenario, or about 11.40 h for all five
      scenarios sequentially at four workers. These are feasibility measurements and linear
      checkpoint projections, not runtime guarantees. No historical Study 0 score or coverage
      outcome was inspected in reaching this decision.
    evidence_refs:
      - src/siamese_compression_lab/coverage_execution.py
      - src/siamese_compression_lab/edge_weight_plan.py
      - src/siamese_compression_lab/subject_bootstrap.py
      - src/siamese_compression_lab/subject_bootstrap_operational.py
      - tests/test_coverage_execution.py
      - tests/test_edge_weight_plan.py
      - tests/test_scientific_harness.py
