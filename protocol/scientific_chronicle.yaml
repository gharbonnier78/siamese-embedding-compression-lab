      - tests/test_decomposed_coverage_integration.py
      - tests/test_decomposed_coverage_idempotence.py
      - scripts/preflight_decomposed_coverage.py
    next_action: >-
      After this governance change is independently reviewed and merged, require a separate
      explicit researcher GO before manually dispatching the 2,000-dataset production
      checkpoint. Do not read historical Study 0 scores before the complete coverage gate
      passes and is reviewed.
