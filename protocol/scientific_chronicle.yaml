  - id: CHRON-20260819-009
    recorded_at_utc: "2026-08-19T08:57:00Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: historical_score_access_authorization
    status: RESOLVED
    outcome_evidence_seen: true
    summary: >-
      Après fusion de PR #31 et GO explicite du chercheur, l'accès aux scores historiques
      Study 0 est autorisé uniquement pour corrected_study_0_reanalysis sous le protocole
      v0.2.2 gelé, sous réserve de revue puis fusion de cette autorisation sur main.
    rationale: >-
      Le known-truth coverage est PASS et sa chaîne de preuve a reçu un APPROVE indépendant.
      PR #31 a été fusionnée sur le commit 91b5b84f1d83c15bd2e3fbfa589f809461a77c8b,
      en conservant explicitement l'interdiction historique jusqu'à une décision séparée.
      Le chercheur a ensuite donné un GO explicite à 2026-08-19T10:57:00+02:00. La présente
