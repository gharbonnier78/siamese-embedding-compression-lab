  - id: CHRON-20260818-007
    recorded_at_utc: "2026-08-18T20:44:00Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: known_truth_coverage_result_review_pending
    status: OPEN
    outcome_evidence_seen: true
    summary: >-
      La campagne de validation de couverture connue du Study 0 v0.2.2 a produit un
      coverage gate PASS au premier checkpoint satisfaisant la précision Monte Carlo,
      soit 4 000 datasets simulés par scénario. Ce résultat valide de façon bornée la
      procédure d'intervalle subject-bootstrap sur les scénarios synthétiques preregistrés ;
      il ne démontre pas encore la non-infériorité de la compression 512D vers 128D.
    rationale: >-
      Le run GitHub Actions 32157868533 a exécuté le chemin décomposé autorisé sur le commit
      f542962a55a095193539a916705dba85d83f0af9. Les cinq scénarios du checkpoint 2 000 ont
      terminé puis la décision intermédiaire a demandé de continuer car toutes les MCSE
      n'étaient pas encore <= 0.005. Les cinq scénarios du checkpoint 4 000 ont ensuite
      terminé, les 15 MCSE ont satisfait le seuil, le checkpoint 10 000 a été ignoré et le
      gate final 4 000 a produit PASS. Les 15 combinaisons scénario x métrique ont une borne
      inférieure exacte Clopper-Pearson >= 0.93, une MCSE <= 0.005 et zéro dataset dégénéré.
      La marge de couverture la plus faible observée dans ce run est
      subject_dependence_noninferior / operational_fnmr : 3781/4000, couverture 0.94525,
      MCSE 0.0035969583504677936, borne inférieure 0.937743380785155. Les artifacts 2 000
      sont byte-for-byte égaux aux préfixes 2 000 correspondants des outcomes 4 000. Aucun
      score historique Study 0 n'a été lu. Le PASS est donc un résultat scientifique borné
      sur la fiabilité de la procédure d'intervalle, pas encore sur la valeur de la
      compression. Une revue indépendante de l'exécution, des hashes et du recalcul du gate
      est requise avant d'autoriser corrected_study_0_reanalysis.
    evidence_refs:
      - https://github.com/gharbonnier78/siamese-embedding-compression-lab/actions/runs/32157868533
      - commit:f542962a55a095193539a916705dba85d83f0af9
      - artifact:9337291600
      - artifact_sha256:106d08bc771a66fccdcc5f925223e9d10f5be738619b80541a77cf0f207d6c3f
      - evidence/study_0_subject_bootstrap_v0.2.2/coverage_validation_run_32157868533/archive_manifest.json
      - evidence/study_0_subject_bootstrap_v0.2.2/coverage_validation_run_32157868533/coverage_gate.json
      - evidence/study_0_subject_bootstrap_v0.2.2/coverage_validation_run_32157868533/coverage_simulation.csv
      - evidence/study_0_subject_bootstrap_v0.2.2/coverage_validation_run_32157868533/verification_report.fr.md
      - evidence/study_0_subject_bootstrap_v0.2.2/coverage_validation_run_32157868533/review_request.fr.md
      - pedagogy/case-studies/coverage-validation-metrologie-statistique.fr.md
    next_action: >-
      Faire effectuer une revue indépendante evidence-based du run 32157868533, recalculer
      les 15 résultats depuis les dataset_outcomes, vérifier les manifests, hashes, préfixes,
      stopping rule et frontière historique, puis ajouter une entrée append-only de
      résolution uniquement si le reviewer conclut APPROVE. Ne pas lire les scores
      historiques Study 0 avant cette résolution.
    blocks:
      - corrected_study_0_reanalysis

  - id: CHRON-20260819-008
    recorded_at_utc: "2026-08-19T06:38:00Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: known_truth_coverage_review_resolution
    status: RESOLVED
    outcome_evidence_seen: true
    supersedes: CHRON-20260818-007
    summary: >-
      La revue indépendante round 2 confirme de bout en bout le PASS de known-truth
      coverage du run 32157868533 et résout le blocker de revue de CHRON-20260818-007.
      Le prérequis de validation de couverture pour corrected_study_0_reanalysis est donc
      satisfait ; l'accès effectif aux scores historiques reste une décision de gouvernance
      séparée et n'est pas autorisé par cette résolution.
    rationale: >-
      Après un round 1 REQUEST_CHANGES pour un miroir CSV non byte-exact et l'absence
      d'accès reviewer aux outcomes bruts, les remédiations ont été conservées sans réduire
      les exigences de revue. Au round 2, le reviewer a recalculé le SHA-256 du bundle brut
      01fec05bb8f635dec1216ed244c677b9ff3059d83641d3c807b121a923f2f96a,
      confirmé 13/13 ZIPs, tous les hashes internes des dix chunks scénario, les cinq
      préfixes 2000 vers 4000 byte-for-byte, la réparation CRLF exacte du CSV, et les quinze
      résultats directement depuis les 20 000 DatasetCoverageOutcome bruts. Les quinze
      combinaisons passent séparément le gate gelé, zéro dataset dégénéré est observé et la
      borne Clopper-Pearson minimale est 0.937743380785155 pour
      subject_dependence_noninferior / operational_fnmr. Le stopping rule 2000 CONTINUE,
      4000 STOP, 10000 skipped est confirmé, ainsi que 100/100 tests, l'absence de fuite
      scientifique dans les progress logs et l'absence de lecture des scores historiques.
      Aucun finding bloquant ou non bloquant ne subsiste. Cette résolution libère uniquement
      le blocker de validation known-truth coverage ; elle ne démontre pas la non-infériorité
      512D vers 128D, ne ferme pas E-STAT-001, ne passe pas G2, ne démarre pas Study 1 et ne
      change pas le contrat qui interdit encore l'accès aux scores historiques.
