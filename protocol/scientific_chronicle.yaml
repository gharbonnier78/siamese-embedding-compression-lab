  - id: CHRON-20260809-004
    recorded_at_utc: "2026-08-09T22:23:50Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: execution_architecture_assurance
    status: OPEN
    outcome_evidence_seen: false
    related_entries:
      - CHRON-20260808-001
      - CHRON-20260808-003
    summary: >-
      The frozen experiment required deterministic dataset-level parallelism because its
      preregistered scale was not operationally credible on the reviewed serial path.
      Parallelism was admissible only after identical ordered DatasetCoverageOutcome values,
      seed lineages and bootstrap digests were demonstrated with and without parallel
      execution. The proposed checkpoint-by-scenario decomposition is a new execution
      architecture and must independently preserve that equivalence before production use.
    rationale: >-
      CHRON-20260808-001 arose from the nested cost of five scenarios, up to 10,000
      independently simulated datasets per scenario and 10,000 subject-bootstrap
      replicates per dataset. Reducing the frozen scale for runtime convenience was not
      admissible, so profiling led first to deterministic dataset-level process parallelism
      and then to vectorized subject-edge weights. Concurrency introduced scientific risks:
      a worker-dependent seed scheme could change the logical dataset-to-stream mapping;
      scheduling could alter output order; retries or redraws could alter the simulated
      ensemble; and a faster implementation could silently change threshold, degeneracy or
      stopping semantics. The condition required to release the original production block
      was therefore not merely a speed benchmark. It was exact reference/vectorized and
      serial/parallel replay evidence, including worker-count invariance, isolated dataset
      lineage and byte-level bootstrap digests. CHRON-20260808-003 records that bounded
      resolution for the current execution path. It established execution feasibility,
      not estimator coverage or 128D non-inferiority. After the 720-minute infrastructure
      timeout, checkpoint-by-scenario decomposition is now being considered to make work
      observable and restartable. That route must not inherit the earlier resolution by
      assumption: monolithic and decomposed executions must produce the same ordered
      outcomes, coverage summaries, degeneracy decisions and selected stopping checkpoint
      under the frozen SeedSequence hierarchy.
    required_equivalence:
      reference_execution: monolithic_checkpoint_scenario_loop
      candidate_execution: decomposed_checkpoint_by_scenario
      relation: exact_scientific_output_equivalence
      invariants:
        - identical_dataset_seed_lineages
        - identical_ordered_dataset_coverage_outcomes
        - identical_bootstrap_vector_digests
        - identical_degeneracy_outcomes
        - identical_scenario_metric_coverage_summaries
        - identical_selected_checkpoint_and_stopping_decision
        - worker_count_does_not_change_outputs
        - historical_study_0_scores_remain_unread
    next_action: >-
      Implement a non-production decomposed runner from the current reviewed execution
      head, compare it against the monolithic runner on the same frozen fixture and root
      seed, and preserve complete equivalence evidence before requesting a resolution that
      releases decomposed production coverage.
    evidence_refs:
      - CHRON-20260808-001
      - CHRON-20260808-003
      - protocol/coverage/study_0_subject_bootstrap_v0.2.2.yaml
      - src/siamese_compression_lab/coverage_execution.py
      - tests/test_coverage_execution.py
      - tests/test_coverage_execution_vectorized.py
      - scripts/benchmark_parallel_coverage_scaling.py
      - scripts/benchmark_vectorized_coverage_execution.py
      - workflow:31312018512:production-subject-bootstrap-coverage:cancelled
      - pedagogy/case-studies/concurrency-is-not-free.md
    blocks:
      - decomposed_production_coverage_gate

  - id: CHRON-20260818-005
    recorded_at_utc: "2026-08-18T05:10:00Z"
    scope: study_0_subject_bootstrap_v0_2_2
    kind: execution_architecture_assurance_resolution
    status: RESOLVED
    outcome_evidence_seen: false
    supersedes: CHRON-20260809-004
    summary: >-
      The decomposed checkpoint-by-scenario production coverage architecture is accepted
      after independent review confirmed exact scientific equivalence to the reviewed
      monolithic execution path, deterministic worker/chunk/retry invariance, canonical
      reconstruction, corruption guards, MCSE-only intermediate stopping semantics, and
      strict separation between runtime observability and admissible scientific outcomes.
    rationale: >-
      PR #28 established the decomposed execution architecture and exact equivalence guards.
      Its independent evidence-based review reported APPROVE with zero blocking findings
      after executing the relevant tests and guards, including all five frozen scenarios,
      exact monolithic/decomposed equality, worker-count and chunk invariance, canonical
      reconstruction, corruption rejection, degeneracy preservation, and the separation
      between MCSE stopping and final coverage-gate materialization. PR #29 then resolved
      the sole non-blocking idempotence improvement identified by that review: an existing
      complete chunk is now protected against destructive overwrite, with exact reruns
      accepted and divergent outcomes or identity rejected before modifying the prior
      complete artifact. Its independent review again reported APPROVE with no blocking or
      non-blocking findings after executing the full 97-test suite and PR #28 regression
      checks. Both merges explicitly preserved the scientific boundary: no historical
      Study 0 score was read, no production coverage outcome was executed or interpreted,
      no coverage gate was released, and no Study 0 scientific claim changed. Therefore
      the execution-architecture blocker is resolved without changing the frozen estimands,
      scenarios, bootstrap semantics, thresholds, MCSE rule, coverage criterion, or seed
      hierarchy. The coverage contract may now transition from
      IMPLEMENTATION_REVIEW_REQUIRED to EXECUTION_AUTHORIZED. This resolution authorizes
      the reviewed execution path only; it is not itself a production campaign run and it
      does not authorize historical reanalysis before the known-truth coverage gate passes.
    evidence_refs:
      - https://github.com/gharbonnier78/siamese-embedding-compression-lab/pull/28
      - commit:3ce187a098b4059e5ac0d5e6b58243e107687b05
      - workflow:32076138679:CI:success
      - workflow:32076138685:Research-assurance:success
      - workflow:32076138712:Decomposed-coverage-equivalence:success
      - https://github.com/gharbonnier78/siamese-embedding-compression-lab/pull/29
      - commit:d27b2f9a6b94d5e0c0268d68c22bb1e70e762164
      - workflow:32097120379:CI:success
      - workflow:32097120420:Decomposed-coverage-equivalence:success
      - src/siamese_compression_lab/decomposed_coverage.py
      - tests/test_decomposed_coverage.py
      - tests/test_decomposed_coverage_integration.py
      - tests/test_decomposed_coverage_idempotence.py
      - scripts/preflight_decomposed_coverage.py
    next_action: >-
      After this governance change is independently reviewed and merged, require a separate
      explicit researcher GO before manually dispatching the 2,000-dataset production
      checkpoint. Do not read historical Study 0 scores before the complete coverage gate
      passes and is reviewed.
    blocks: []

