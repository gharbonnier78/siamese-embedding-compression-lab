name: Study 1B Engineering Assurance

on:
  pull_request:
    paths:
      - 'src/siamese_compression_lab/study1b_*'
      - 'scripts/study1b_*'
      - 'tests/test_study1b_*'
      - 'protocol/studies/STUDY1B_*'
      - 'protocol/studies/study_1b_matched_compression.yaml'
      - 'protocol/simulations/STUDY1B_*'
      - '.github/workflows/study1b-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install POC assurance tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e '.[dev]'
          python -m pip install bandit pip-audit
      - name: Compile and lint Study 1B code
        run: |
          python -m compileall -q src scripts tests
          ruff check \
            src/siamese_compression_lab/study1b_preflight.py \
            src/siamese_compression_lab/study1b_statistics.py \
            src/siamese_compression_lab/study1b_simulation.py \
            src/siamese_compression_lab/study1b_execution.py \
            scripts/study1b_preflight_lfw.py \
            scripts/study1b_run_simulation_shard.py \
            scripts/study1b_execute.py \
            tests/test_study1b_preflight_execution.py
      - name: Focused unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_study1b_preflight_execution -v
      - name: Static security scan
        run: |
          bandit -q -r \
            src/siamese_compression_lab/study1b_preflight.py \
            src/siamese_compression_lab/study1b_statistics.py \
            src/siamese_compression_lab/study1b_simulation.py \
            src/siamese_compression_lab/study1b_execution.py \
            scripts/study1b_preflight_lfw.py \
            scripts/study1b_run_simulation_shard.py \
            scripts/study1b_execute.py
      - name: Dependency vulnerability review
        run: pip-audit
      - name: Bounded secret-pattern check
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- ':!*.md'; then
            echo 'Potential committed secret pattern found' >&2
            exit 1
          fi
      - name: Generate machine-readable SBOM
        run: python scripts/study1_generate_sbom.py artifacts/study1b/assurance/sbom.cdx.json
      - name: Upload POC assurance artifact
        uses: actions/upload-artifact@v4
        with:
          name: study1b-poc-assurance
          path: artifacts/study1b/assurance
          if-no-files-found: error
