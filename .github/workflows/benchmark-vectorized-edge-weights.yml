name: Vectorized edge-weight benchmark

on:
  pull_request:
    paths:
      - "scripts/benchmark_vectorized_edge_weights.py"
      - "src/siamese_compression_lab/subject_bootstrap_vectorized.py"
      - "src/siamese_compression_lab/subject_bootstrap.py"
      - "src/siamese_compression_lab/subject_bootstrap_operational.py"
      - "tests/test_subject_bootstrap_vectorized.py"
      - ".github/workflows/benchmark-vectorized-edge-weights.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scalar-vectorized equivalence tests
        run: python -m unittest tests.test_subject_bootstrap_vectorized -v
      - name: Run non-outcome vectorized edge-weight benchmark
        run: |
          python scripts/benchmark_vectorized_edge_weights.py \
            --replicates 1000 \
            --repeats 3 \
            --output vectorized-edge-weights-benchmark.json
      - name: Assert benchmark boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("vectorized-edge-weights-benchmark.json").read_text())
          assert result["historical_study_0_scores_read"] is False
          assert result["coverage_outcomes_aggregated"] is False
          assert result["production_coverage_gate_executed"] is False
          assert result["scalar_vectorized_equivalence_verified"] is True
          assert result["configuration"]["subjects"] == 963
          assert result["configuration"]["pairs"] == 1000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vectorized-edge-weights-benchmark
          path: vectorized-edge-weights-benchmark.json
          if-no-files-found: error
          retention-days: 30
