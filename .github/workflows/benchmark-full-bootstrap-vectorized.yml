name: Full bootstrap vectorization benchmark

on:
  pull_request:
    paths:
      - "src/siamese_compression_lab/edge_weights_vectorized.py"
      - "src/siamese_compression_lab/subject_bootstrap_vectorized.py"
      - "src/siamese_compression_lab/subject_bootstrap.py"
      - "src/siamese_compression_lab/subject_bootstrap_operational.py"
      - "tests/test_subject_bootstrap_vectorized.py"
      - "scripts/benchmark_full_bootstrap_vectorized.py"
      - ".github/workflows/benchmark-full-bootstrap-vectorized.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run exact vectorized bootstrap tests
        run: python -m unittest tests.test_subject_bootstrap_vectorized -v
      - name: Run non-outcome full-bootstrap reprofile
        run: |
          python scripts/benchmark_full_bootstrap_vectorized.py \
            --replicates 1000 \
            --repeats 3 \
            --output full-bootstrap-vectorized.json
      - name: Assert replay and evidence boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("full-bootstrap-vectorized.json").read_text())
          assert result["historical_study_0_scores_read"] is False
          assert result["coverage_outcomes_aggregated"] is False
          assert result["production_coverage_gate_executed"] is False
          assert result["exact_representation_replay_verified"] is True
          assert result["exact_operational_replay_verified"] is True
          assert result["configuration"]["bootstrap_replicates"] == 1000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-bootstrap-vectorized-reprofile
          path: full-bootstrap-vectorized.json
          if-no-files-found: error
          retention-days: 30
