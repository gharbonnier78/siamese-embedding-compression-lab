name: Study 1B Power Design S3 Information Feasibility

on:
  push:
    branches:
      - agent/study1b-preregistration-20260827
    paths:
      - 'protocol/chronicle/STUDY1B_POWER_DESIGN_S3_INFORMATION_FEASIBILITY_RETRY2_2026-09-01.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and LFW access
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e . kagglehub
      - name: Resolve LFW dataset root
        id: lfw
        run: |
          python - <<'PY'
          import contextlib, os, sys, kagglehub
          with contextlib.redirect_stdout(sys.stderr):
              root = kagglehub.dataset_download('jessicali9530/lfw-dataset/versions/4')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'root={root}\n')
          PY
      - name: Stage pinned LFW View 1 metadata
        run: |
          cp protocol/sources/lfw_view1/peopleDevTrain.txt '${{ steps.lfw.outputs.root }}/peopleDevTrain.txt'
          cp protocol/sources/lfw_view1/peopleDevTest.txt '${{ steps.lfw.outputs.root }}/peopleDevTest.txt'
          python - <<'PY'
          from pathlib import Path
          root = Path(r'''${{ steps.lfw.outputs.root }}''')
          for name, expected in [('peopleDevTrain.txt', 4038), ('peopleDevTest.txt', 1711)]:
              path = root / name
              lines = [line.strip() for line in path.read_text(encoding='utf-8-sig').splitlines() if line.strip()]
              assert int(lines[0]) == expected, (name, lines[0], expected)
              assert len(lines) - 1 == expected, (name, len(lines) - 1, expected)
          PY
      - name: Materialize active amended boundary
        env:
          PYTHONPATH: src
        run: |
          python scripts/study1b_apply_active_data_boundary.py \
            --dataset-root '${{ steps.lfw.outputs.root }}' \
            --output-dir artifacts/study1b/s3-input
      - name: Audit distinct information capacity
        run: |
          python scripts/study1b_s3_information_feasibility.py \
            --manifest artifacts/study1b/s3-input/capture_manifest.csv \
            --test-graph artifacts/study1b/s3-input/graphs/test_pairs.csv \
            --output artifacts/study1b/s3-feasibility/s3_information_feasibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: study1b-s3-information-feasibility
          path: artifacts/study1b/s3-feasibility/s3_information_feasibility.json
          if-no-files-found: error
