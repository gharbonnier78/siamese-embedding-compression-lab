name: Materialize LFW DevTest evidence

on:
  pull_request:
    paths:
      - "scripts/materialize_lfw_devtest.py"
      - ".github/workflows/materialize-lfw-devtest.yml"
      - "src/siamese_compression_lab/subject_bootstrap.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install materialization dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "kagglehub>=0.3"

      - name: Materialize exact Kaggle v4 DevTest evidence
        run: |
          python scripts/materialize_lfw_devtest.py \
            --output-dir /tmp/lfw-devtest-evidence

      - name: Show immutable evidence manifest
        run: cat /tmp/lfw-devtest-evidence/source_manifest.json

      - name: Upload verified evidence including exact source CSVs
        uses: actions/upload-artifact@v4
        with:
          name: lfw-devtest-v0.2.2-source-evidence
          path: /tmp/lfw-devtest-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Version pseudonymized subject-map evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          evidence_dir="evidence/study_0_subject_bootstrap_v0.2.2"
          mkdir -p "$evidence_dir"
          cp /tmp/lfw-devtest-evidence/test_pair_subject_map_v0.2.2.csv "$evidence_dir/"
          cp /tmp/lfw-devtest-evidence/source_manifest.json "$evidence_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence_dir/test_pair_subject_map_v0.2.2.csv" "$evidence_dir/source_manifest.json"
          if git diff --cached --quiet; then
            echo "Verified evidence already versioned; no commit required."
          else
            git commit -m "Add verified LFW DevTest subject-map evidence"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
