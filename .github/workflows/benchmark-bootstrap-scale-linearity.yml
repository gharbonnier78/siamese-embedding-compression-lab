name: Bootstrap scale linearity benchmark

on:
  pull_request:
    paths:
      - "scripts/benchmark_bootstrap_scale_linearity.py"
      - "src/siamese_compression_lab/coverage_execution.py"
      - "src/siamese_compression_lab/subject_bootstrap_vectorized.py"
      - ".github/workflows/benchmark-bootstrap-scale-linearity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run direct 1k-to-10k scaling check
        run: |
          python scripts/benchmark_bootstrap_scale_linearity.py \
            --datasets 4 \
            --small-replicates 1000 \
            --frozen-replicates 10000 \
            --repeats 3 \
            --output bootstrap-scale-linearity.json
      - name: Assert non-outcome boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("bootstrap-scale-linearity.json").read_text())
          assert result["historical_study_0_scores_read"] is False
          assert result["coverage_outcomes_aggregated"] is False
          assert result["production_coverage_gate_executed"] is False
          assert result["deterministic_replay_verified_within_each_scale"] is True
          assert result["configuration"]["frozen_replicates"] == 10000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-scale-linearity
          path: bootstrap-scale-linearity.json
          if-no-files-found: error
          retention-days: 30
