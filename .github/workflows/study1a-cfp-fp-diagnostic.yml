name: Study 1A CFP-FP Source Diagnostic

on:
  push:
    branches:
      - agent/study1a-go-preexecution-20260824
    paths:
      - '.github/workflows/study1a-cfp-fp-diagnostic.yml'
      - 'scripts/study1a_cfp_fp_source_diagnostic.py'
      - 'protocol/studies/STUDY1A_CFP_FP_DIAGNOSTIC_PLAN_2026-08-25.md'
  pull_request:
    paths:
      - '.github/workflows/study1a-cfp-fp-diagnostic.yml'
      - 'scripts/study1a_cfp_fp_source_diagnostic.py'
      - 'protocol/studies/STUDY1A_CFP_FP_DIAGNOSTIC_PLAN_2026-08-25.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: ${{ matrix.source_label }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_label: gaunernst
            dataset_repo: gaunernst/face-recognition-eval
          - source_label: namkuner
            dataset_repo: namkuner/namkuner_face_dataset
    env:
      CHECKPOINT_REPO: VishalMishraTss/AdaFace
      CHECKPOINT_FILE: adaface_ir101_webface12m.ckpt
      CHECKPOINT_SHA256: 0e7a3238d2a50f3fe3860782534928ac7cb2598977cf897f6869fd5ac2493fd0
      ADAFACE_COMMIT: c60eaa786a42c03444f3df7096dbaf9d57ae010d
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install bounded diagnostic dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' \
            'torch==2.8.0' \
            'opencv-python-headless==4.10.0.84' \
            'huggingface_hub==0.34.4'

      - name: Materialize hash-pinned AdaFace checkpoint
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          root = Path('study1a/cfp_diag/model')
          root.mkdir(parents=True, exist_ok=True)
          path = Path(hf_hub_download(
              repo_id=os.environ['CHECKPOINT_REPO'],
              filename=os.environ['CHECKPOINT_FILE'],
              local_dir=root,
          ))
          h = hashlib.sha256()
          with path.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  h.update(chunk)
          observed = h.hexdigest()
          expected = os.environ['CHECKPOINT_SHA256']
          if observed != expected:
              raise SystemExit(f'checkpoint SHA mismatch: {observed} != {expected}')
          Path('study1a/cfp_diag/checkpoint_path.txt').write_text(str(path) + '\n', encoding='utf-8')
          print(f'checkpoint verified: {observed}')
          PY

      - name: Materialize independent CFP-FP source
        env:
          DATASET_REPO: ${{ matrix.dataset_repo }}
          SOURCE_LABEL: ${{ matrix.source_label }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          label = os.environ['SOURCE_LABEL']
          repo = os.environ['DATASET_REPO']
          root = Path('study1a/cfp_diag/data') / label
          root.mkdir(parents=True, exist_ok=True)
          path = Path(hf_hub_download(
              repo_id=repo,
              filename='cfp_fp.bin',
              repo_type='dataset',
              local_dir=root,
          ))
          h = hashlib.sha256()
          with path.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  h.update(chunk)
          manifest = {
              'source_label': label,
              'repo': repo,
              'path': str(path),
              'sha256': h.hexdigest(),
              'size_bytes': path.stat().st_size,
              'canonical_icar_sha256': '76306c783c2ef59c8569ebdcdd2f529f450bcc3fad57c94a5fc2b91df0f10370',
              'byte_identical_to_canonical_icar': h.hexdigest() == '76306c783c2ef59c8569ebdcdd2f529f450bcc3fad57c94a5fc2b91df0f10370',
          }
          out = Path('study1a/cfp_diag') / f'{label}_source_manifest.json'
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('study1a/cfp_diag/dataset_path.txt').write_text(str(path) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Materialize pinned AdaFace inference code
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/mk-minchul/AdaFace.git study1a/cfp_diag/AdaFace
          git -C study1a/cfp_diag/AdaFace checkout "$ADAFACE_COMMIT" -- net.py evaluate_utils.py utils.py train_val.py
          test "$(git -C study1a/cfp_diag/AdaFace rev-parse HEAD)" = "$ADAFACE_COMMIT"

      - name: Execute diagnostic-only CFP-FP evaluation
        env:
          DATASET_REPO: ${{ matrix.dataset_repo }}
          SOURCE_LABEL: ${{ matrix.source_label }}
        run: |
          CHECKPOINT_PATH="$(cat study1a/cfp_diag/checkpoint_path.txt)"
          DATASET_PATH="$(cat study1a/cfp_diag/dataset_path.txt)"
          python scripts/study1a_cfp_fp_source_diagnostic.py \
            --benchmark-script scripts/study1a_run_a1_a2_benchmark.py \
            --source-label "$SOURCE_LABEL" \
            --dataset-file "$DATASET_PATH" \
            --dataset-locator "hf-dataset://${DATASET_REPO}/cfp_fp.bin" \
            --checkpoint "$CHECKPOINT_PATH" \
            --checkpoint-locator "hf://VishalMishraTss/AdaFace/adaface_ir101_webface12m.ckpt#sha256=${CHECKPOINT_SHA256}" \
            --adaface-src study1a/cfp_diag/AdaFace \
            --output "study1a/cfp_diag/${SOURCE_LABEL}_diagnostic.json" \
            --batch-size 32 \
            --torch-threads 4

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study1a-cfp-fp-diagnostic-${{ matrix.source_label }}
          path: |
            study1a/cfp_diag/${{ matrix.source_label }}_source_manifest.json
            study1a/cfp_diag/${{ matrix.source_label }}_diagnostic.json
          if-no-files-found: warn
          retention-days: 30

  summarize:
    name: summarize-cfp-fp-diagnostic
    needs: diagnostic
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: study1a-cfp-fp-diagnostic-*
          path: diagnostic
          merge-multiple: true

      - name: Build diagnostic-only source comparison
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('diagnostic')
          diagnostics = {}
          manifests = {}
          file_hashes = {}
          for path in sorted(root.glob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              file_hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.name.endswith('_diagnostic.json'):
                  diagnostics[payload['source_label']] = payload
              elif path.name.endswith('_source_manifest.json'):
                  manifests[payload['source_label']] = payload

          summary = {
              'schema_version': '1.0',
              'kind': 'study1a_cfp_fp_diagnostic_summary',
              'diagnostic_only': True,
              'gate_authority': False,
              'canonical_cfp_fp_decision': 'FAIL',
              'canonical_run_id': 32773439197,
              'canonical_icar_sha256': '76306c783c2ef59c8569ebdcdd2f529f450bcc3fad57c94a5fc2b91df0f10370',
              'canonical_icar_accuracy': 0.9765714285714285,
              'frozen_minimum': 0.9896,
              'published_reference': 0.9926,
              'manifests': manifests,
              'diagnostics': diagnostics,
              'evidence_file_sha256': file_hashes,
              'interpretation_boundary': (
                  'Diagnostic evidence cannot release or rewrite the canonical gate. A demonstrated '
                  'source/protocol defect requires a separately reviewed correction/replay decision.'
              ),
          }
          Path('summary').mkdir(exist_ok=True)
          Path('summary/cfp_fp_diagnostic_summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload combined diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: study1a-cfp-fp-diagnostic-bundle
          path: |
            diagnostic/*.json
            summary/cfp_fp_diagnostic_summary.json
          retention-days: 30
