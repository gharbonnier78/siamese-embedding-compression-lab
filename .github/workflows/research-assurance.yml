name: Research assurance

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "AGENTS.md"
      - "harness-adoption.yaml"
      - "claims/**"
      - "beliefs/**"
      - "datasets/**"
      - "gates/**"
      - "evidence/**"
      - "protocol/**"
      - "docs/SCIENTIFIC_HARNESS.md"
      - "paper/**"
      - "pedagogy/**"
      - "scripts/generate_research_figures.py"
      - "scripts/validate_research_program.py"
      - "scripts/validate_scientific_harness.py"
      - "scripts/run_subject_bootstrap_coverage.py"
      - "scripts/run_study0_historical_reanalysis.py"
      - ".github/workflows/production-subject-bootstrap-coverage.yml"
      - "src/siamese_compression_lab/research_assurance.py"
      - "src/siamese_compression_lab/scientific_harness.py"
      - "src/siamese_compression_lab/historical_reanalysis.py"
      - "tests/test_generated_figures.py"
      - "tests/test_harness_adoption.py"
      - "tests/test_research_assurance.py"
      - "tests/test_scientific_harness.py"
      - "tests/test_historical_reanalysis_runner.py"
      - ".github/workflows/research-assurance.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Claims, gates, replay and chronicle contracts
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The generated figure manifest records the Python patch version.
          # Pin it so a hosted-runner patch update cannot create false evidence drift.
          python-version: "3.12.13"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r requirements-render.txt
      - name: Validate machine-readable research programme
        run: python scripts/validate_research_program.py --root . --output assurance-report.json
      - name: Validate scientific chronicle harness
        run: python scripts/validate_scientific_harness.py --output scientific-harness-report.json
      - name: Regenerate figures from replay evidence
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          python scripts/generate_research_figures.py
          git diff --exit-code -- paper/figures-generated
      - name: Run assurance unit tests
        run: >-
          python -m unittest
          tests.test_harness_adoption
          tests.test_research_assurance
          tests.test_scientific_harness
          tests.test_coverage_contract_authorization
          tests.test_production_coverage_workflow
          tests.test_generated_figures
          tests.test_historical_reanalysis_runner
          -v

  paper:
    name: Rebuild research paper
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -cd paper/main.tex
      - name: Verify bitwise paper reproducibility
        run: |
          cp paper/main.pdf /tmp/main-first.pdf
          latexmk -g -pdf -interaction=nonstopmode -halt-on-error -cd paper/main.tex
          cmp /tmp/main-first.pdf paper/main.pdf
