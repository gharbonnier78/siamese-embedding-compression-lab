name: Build v0.2.3 paper PDF

on:
  push:
    branches:
      - agent/study0-v0.2.3-paper-20260820
    paths:
      - "paper/main.tex"
      - "paper/study0_v0.2.3.tex"
      - ".github/workflows/build-v0.2.3-paper.yml"

permissions:
  contents: write

jobs:
  build-and-archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/study0-v0.2.3-paper-20260820
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile twice and verify reproducibility
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -cd paper/main.tex
          cp paper/main.pdf /tmp/main-first.pdf
          latexmk -g -pdf -interaction=nonstopmode -halt-on-error -cd paper/main.tex
          cmp /tmp/main-first.pdf paper/main.pdf
      - name: Archive versioned PDF
        run: |
          mkdir -p output/pdf
          cp paper/main.pdf output/pdf/siamese_embedding_compression_research_program_v0.2.3.pdf
          sha256sum output/pdf/siamese_embedding_compression_research_program_v0.2.3.pdf
      - name: Commit generated PDF
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output/pdf/siamese_embedding_compression_research_program_v0.2.3.pdf
          if git diff --cached --quiet; then
            echo "Versioned PDF already up to date."
          else
            git commit -m "Build v0.2.3 paper PDF"
            git push origin HEAD:agent/study0-v0.2.3-paper-20260820
          fi
