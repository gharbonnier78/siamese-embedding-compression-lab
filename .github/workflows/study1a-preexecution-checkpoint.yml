name: Study 1A Preexecution Checkpoint

on:
  pull_request:
    paths:
      - '.github/workflows/study1a-preexecution-checkpoint.yml'
      - 'protocol/authorizations/study_1a_execution_go_2026-08-24.yaml'
      - 'protocol/studies/study_1_face_backbone.yaml'
      - 'protocol/studies/STUDY1_BACKBONE_ACCEPTANCE_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKPOINT_FILE_ID: 1dswnavflETcnAuplZj1IOKKP0eM8ITgT
  CHECKPOINT_NAME: adaface_ir101_webface12m.ckpt

jobs:
  materialize-checkpoint-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded downloader
        run: python -m pip install --disable-pip-version-check 'gdown==5.2.0'
      - name: Download official AdaFace R100 WebFace12M checkpoint
        run: |
          mkdir -p preexecution
          python -m gdown "https://drive.google.com/uc?id=${CHECKPOINT_FILE_ID}" -O "preexecution/${CHECKPOINT_NAME}"
          test -s "preexecution/${CHECKPOINT_NAME}"
      - name: Materialize immutable identity metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path('preexecution') / os.environ['CHECKPOINT_NAME']
          digest = hashlib.sha256()
          with path.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          metadata = {
              'artifact_role': 'Study 1A checkpoint identity only; non-outcome-bearing engineering evidence',
              'checkpoint_identity': 'AdaFace R100 / WebFace12M',
              'source_google_drive_file_id': os.environ['CHECKPOINT_FILE_ID'],
              'filename': path.name,
              'size_bytes': path.stat().st_size,
              'sha256': digest.hexdigest(),
              'scientific_outcomes_opened': False,
              'checkpoint_deserialized': False,
          }
          Path('preexecution/checkpoint_identity.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(metadata, sort_keys=True))
          PY
      - name: Upload identity metadata only
        uses: actions/upload-artifact@v4
        with:
          name: study1a-checkpoint-identity
          path: preexecution/checkpoint_identity.json
          if-no-files-found: error
          retention-days: 30
