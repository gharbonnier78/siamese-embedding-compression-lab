name: Frozen-inner parallel coverage benchmark

on:
  pull_request:
    paths:
      - "src/siamese_compression_lab/edge_weight_plan.py"
      - "src/siamese_compression_lab/subject_bootstrap.py"
      - "src/siamese_compression_lab/subject_bootstrap_operational.py"
      - "scripts/benchmark_parallel_coverage_scaling.py"
      - ".github/workflows/benchmark-parallel-coverage-frozen-inner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run frozen-inner non-outcome benchmark
        run: |
          python scripts/benchmark_parallel_coverage_scaling.py \
            --datasets 8 \
            --bootstrap-replicates 10000 \
            --repeats 1 \
            --workers 1 2 4 \
            --output frozen-inner-parallel-scaling.json
      - name: Assert frozen scale and scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("frozen-inner-parallel-scaling.json").read_text())
          assert result["configuration"]["bootstrap_replicates_per_dataset"] == 10000
          assert result["configuration"]["frozen_bootstrap_replicates_per_dataset"] == 10000
          assert all(row["production_scale_factor"] == 1.0 for row in result["results"])
          assert result["historical_study_0_scores_read"] is False
          assert result["coverage_outcomes_aggregated"] is False
          assert result["production_coverage_gate_executed"] is False
          assert result["equivalence_verified_against_workers_1"] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-inner-parallel-scaling
          path: frozen-inner-parallel-scaling.json
          if-no-files-found: error
          retention-days: 30
