name: Production subject-bootstrap coverage

on:
  workflow_dispatch:
    inputs:
      confirm_execution:
        description: Confirm that the frozen coverage contract is authorized for execution
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-subject-bootstrap-coverage
  cancel-in-progress: false

jobs:
  coverage:
    if: ${{ inputs.confirm_execution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert production coverage preflight is unblocked
        run: |
          python - <<'PY'
          from siamese_compression_lab.scientific_harness import assert_execution_unblocked

          assert_execution_unblocked(
              "protocol/scientific_chronicle.yaml",
              "gates/scientific_harness.yaml",
              "production_coverage_gate",
          )
          PY

      - name: Execute frozen production coverage gate
        id: coverage
        continue-on-error: true
        run: |
          python scripts/run_subject_bootstrap_coverage.py \
            --output-dir artifacts/coverage-v0.2.2 \
            --workers 4

      - name: Write execution metadata
        if: always()
        env:
          COVERAGE_STEP_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          mkdir -p artifacts/coverage-v0.2.2
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "workflow": "production-subject-bootstrap-coverage",
              "git_sha": os.environ["GITHUB_SHA"],
              "git_ref": os.environ["GITHUB_REF"],
              "coverage_step_outcome": os.environ.get("COVERAGE_STEP_OUTCOME"),
              "smoke_mode": False,
              "workers": 4,
              "timeout_minutes": 720,
              "progress_instrumentation_expected": True,
              "historical_study_0_scores_permitted": False,
          }
          path = Path("artifacts/coverage-v0.2.2/execution_metadata.json")
          path.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload production coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-0-v0.2.2-production-coverage-v2
          path: artifacts/coverage-v0.2.2/
          if-no-files-found: error
          retention-days: 90

      - name: Propagate scientific gate failure after evidence upload
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "Production coverage runner returned non-zero. Evidence has been uploaded above."
          exit 1
