name: Vectorized end-to-end coverage benchmark

on:
  pull_request:
    paths:
      - "src/siamese_compression_lab/coverage_execution.py"
      - "src/siamese_compression_lab/subject_bootstrap_vectorized.py"
      - "src/siamese_compression_lab/edge_weights_vectorized.py"
      - "tests/test_coverage_execution_vectorized.py"
      - "scripts/benchmark_vectorized_coverage_execution.py"
      - "protocol/coverage/study_0_subject_bootstrap_v0.2.2.yaml"
      - ".github/workflows/benchmark-vectorized-coverage-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run end-to-end equivalence tests
        run: python -m pytest -q tests/test_coverage_execution_vectorized.py
      - name: Run non-outcome vectorized execution benchmark
        run: |
          python scripts/benchmark_vectorized_coverage_execution.py \
            --datasets 16 \
            --bootstrap-replicates 1000 \
            --repeats 3 \
            --workers 1 2 4 \
            --output vectorized-coverage-execution.json
      - name: Assert benchmark boundaries and frozen-scale extrapolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("vectorized-coverage-execution.json").read_text())
          assert result["historical_study_0_scores_read"] is False
          assert result["coverage_outcomes_aggregated"] is False
          assert result["production_coverage_gate_executed"] is False
          assert result["exact_dataset_outcome_equivalence_verified"] is True
          assert result["execution_contract"]["selected_engine"] == "vectorized"
          assert result["execution_contract"]["reference_oracle_engine"] == "legacy"
          assert result["execution_contract"]["exact_dataset_outcome_equivalence_required"] is True
          assert result["interpretation_boundary"]["speedup_compares_same_worker_count"] is True
          assert "same worker count" in result["speedup_definition"]
          assert result["configuration"]["bootstrap_replicates_per_dataset"] == 1000
          assert result["configuration"]["frozen_bootstrap_replicates_per_dataset"] == 10000
          assert [row["workers"] for row in result["results"]] == [1, 2, 4]
          assert all(row["production_scale_factor"] == 10 for row in result["results"])
          assert all(row["speedup_definition"] == result["speedup_definition"] for row in result["results"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vectorized-coverage-execution
          path: vectorized-coverage-execution.json
          if-no-files-found: error
          retention-days: 30
