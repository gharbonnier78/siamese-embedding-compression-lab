name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Python ${{ matrix.python-version }} smoke validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      MPLBACKEND: Agg
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development checks
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Research-contract assurance
        run: python scripts/validate_research_program.py --root .
      - name: Unit and replay smoke tests
        run: python -m unittest discover -s tests -v
