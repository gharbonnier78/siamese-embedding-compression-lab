name: Edge-weight vectorization benchmark

on:
  pull_request:
    paths:
      - "src/siamese_compression_lab/subject_bootstrap_vectorized.py"
      - "src/siamese_compression_lab/coverage_execution.py"
      - "tests/test_subject_bootstrap_vectorized.py"
      - "scripts/benchmark_edge_weights_vectorization.py"
      - ".github/workflows/benchmark-edge-weights-vectorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scalar/vectorized equivalence tests
        run: pytest -q tests/test_subject_bootstrap_vectorized.py
      - name: Run non-outcome vectorization benchmark
        run: |
          python scripts/benchmark_edge_weights_vectorization.py \
            --component-draws 5000 \
            --bootstrap-replicates 1000 \
            --repeats 3 \
            --output edge-weights-vectorization.json
      - name: Assert benchmark boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("edge-weights-vectorization.json").read_text())
          assert result["historical_study_0_scores_read"] is False
          assert result["production_coverage_gate_executed"] is False
          assert result["scalar_vectorized_outputs_identical"] is True
          assert result["configuration"]["pairs"] == 1000
          assert result["configuration"]["subjects"] == 963
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edge-weights-vectorization
          path: edge-weights-vectorization.json
          if-no-files-found: error
          retention-days: 30
