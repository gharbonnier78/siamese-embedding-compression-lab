      - name: Execute one complete frozen scenario
        run: |
          python scripts/run_subject_bootstrap_coverage_scenario.py \
            --scenario "${{ matrix.scenario }}" \
            --checkpoint 4000 \
            --workers 4 \
            --git-commit "$GITHUB_SHA" \
            --output-dir "artifacts/coverage/4000/${{ matrix.scenario }}"
      - name: Preserve complete or interrupted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-4000-${{ matrix.scenario }}
          path: artifacts/coverage/4000/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate_4000:
    name: Precision decision 4000
    needs: coverage_4000
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      stop: ${{ steps.decision.outputs.stop }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
