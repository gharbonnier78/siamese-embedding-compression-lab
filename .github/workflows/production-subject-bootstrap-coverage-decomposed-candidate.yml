    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-10000-*
          path: artifacts/downloaded
      - name: Finalize last allowed checkpoint without masking a scientific FAIL
        id: final
        shell: bash
        run: |
          set -uo pipefail
          artifact_args=()
