          echo "stop=$stop" >> "$GITHUB_OUTPUT"
      - name: Preserve precision decision
        uses: actions/upload-artifact@v4
        with:
          name: precision-decision-4000
          path: artifacts/precision-4000/
          if-no-files-found: error
          retention-days: 90

  finalize_4000:
    name: Final coverage gate 4000
    needs: [aggregate_2000, aggregate_4000]
    if: needs.aggregate_2000.outputs.stop != 'true' && needs.aggregate_4000.outputs.stop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-4000-*
          path: artifacts/downloaded
      - name: Finalize selected checkpoint without masking a scientific FAIL
        id: final
        shell: bash
        run: |
          set -uo pipefail
          artifact_args=()
          for directory in artifacts/downloaded/coverage-4000-*; do
            artifact_args+=(--artifact-dir "$directory")
          done
          set +e
          python scripts/finalize_subject_bootstrap_coverage.py \
            "${artifact_args[@]}" \
            --checkpoint 4000 \
            --git-commit "$GITHUB_SHA" \
            --output-dir artifacts/final-coverage
          status=$?
          set -e
          echo "gate_exit=$status" >> "$GITHUB_OUTPUT"
      - name: Upload final evidence before propagating the gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-0-v0.2.2-decomposed-coverage-final-4000
          path: artifacts/final-coverage/
          if-no-files-found: error
          retention-days: 90
      - name: Propagate scientific gate result
        if: steps.final.outputs.gate_exit != '0'
        run: exit "${{ steps.final.outputs.gate_exit }}"

  coverage_10000:
    name: Coverage 10000 / ${{ matrix.scenario }}
    needs: aggregate_4000
    if: needs.aggregate_4000.outputs.stop != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - independent_pair_null
          - subject_dependence_null
          - subject_dependence_noninferior
          - subject_dependence_boundary
