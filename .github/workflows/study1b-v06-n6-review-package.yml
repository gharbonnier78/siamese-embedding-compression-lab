name: Study 1B v0.6 N6 Review Package

on:
  push:
    branches:
      - agent/study1b-preregistration-20260827
    paths:
      - '.github/workflows/study1b-v06-n6-review-package.yml'
      - 'AGENTS.md'
      - 'harness-adoption.yaml'
      - 'handoffs/STUDY1B_NEW_CHAT_HANDOFF_2026-09-15.md'
      - 'paper/study1_protocol_v0.4-preexecution.md'
      - 'paper/siamese_embedding_compression_research_program_v0.3.tex'
      - 'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_2026-09-08.yaml'
      - 'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_D1_D3_ADDENDUM_V0_2_2026-09-14.yaml'
      - 'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_ENVIRONMENT_LOCK_V0_6_2026-09-14.yaml'
      - 'protocol/reviews/PR50_CB124244_D2_V05_FOCUSED_REREVIEW_VERDICT_2026-09-10.md'
      - 'protocol/chronicle/STUDY1B_PR50_PREEXECUTION_SEMANTIC_HARDENING_V0_6_OPEN_2026-09-14.yaml'
      - 'protocol/chronicle/STUDY1B_HUMAN_READABLE_DOCUMENTATION_SYNC_V0_3_2026-09-15.yaml'
      - 'tests/test_study1b_engineering_benchmark_contract_v06.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-n6-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install focused review dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Build exact-head N6 package
        env:
          REVIEW_HEAD_SHA: ${{ github.sha }}
          REVIEW_BASE_SHA: 5730e6bfa07b51afbe7ad6a89ffb4a6bd0ba6eb7
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          head = os.environ['REVIEW_HEAD_SHA']
          base = os.environ['REVIEW_BASE_SHA']
          out = root / 'artifacts/study1b/v06-n6-review-package'
          bundle = root / 'artifacts/study1b/v06-n6-review-bundle'
          shutil.rmtree(out, ignore_errors=True)
          shutil.rmtree(bundle, ignore_errors=True)
          out.mkdir(parents=True)
          bundle.mkdir(parents=True)

          sources = [
              'AGENTS.md',
              'harness-adoption.yaml',
              'handoffs/STUDY1B_NEW_CHAT_HANDOFF_2026-09-15.md',
              'paper/study1_protocol_v0.4-preexecution.md',
              'paper/siamese_embedding_compression_research_program_v0.3.tex',
              'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_2026-09-08.yaml',
              'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_D1_D3_ADDENDUM_2026-09-08.yaml',
              'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_BENCHMARK_V0_3_D1_D3_ADDENDUM_V0_2_2026-09-14.yaml',
              'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_ENVIRONMENT_LOCK_V0_5_2026-09-10.yaml',
              'protocol/benchmarks/STUDY1B_JUNGLE_CHAMPIONSHIP_ENGINEERING_ENVIRONMENT_LOCK_V0_6_2026-09-14.yaml',
              'protocol/chronicle/STUDY1B_PR50_CB124244_D2_V05_ACCEPT_2026-09-14.yaml',
              'protocol/chronicle/STUDY1B_PR50_PREEXECUTION_SEMANTIC_HARDENING_V0_6_OPEN_2026-09-14.yaml',
              'protocol/chronicle/STUDY1B_HUMAN_READABLE_DOCUMENTATION_SYNC_V0_3_2026-09-15.yaml',
              'protocol/decisions/STUDY1B_S4N1_S4N2_SHARED_POPULATION_AND_T19_CLARIFICATION_2026-09-08.yaml',
              'protocol/reviews/PR50_CB124244_D2_V05_FOCUSED_REREVIEW_VERDICT_2026-09-10.md',
              'tests/test_study1b_engineering_benchmark_contract_v06.py',
          ]

          def blob_sha(data):
              header = b'blob ' + str(len(data)).encode('ascii') + b'\0'
              return hashlib.sha1(header + data).hexdigest()

          entries = []
          for rel in sources:
              src = root / rel
              if not src.is_file():
                  raise SystemExit(f'missing required source: {rel}')
              data = src.read_bytes()
              expected = subprocess.check_output(
                  ['git', 'rev-parse', f'{head}:{rel}'], text=True
              ).strip()
              actual = blob_sha(data)
              if actual != expected:
                  raise SystemExit(f'Git blob mismatch before package: {rel}')
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
              entries.append({
                  'path': rel,
                  'byte_length': len(data),
                  'git_blob_sha1_expected': expected,
                  'git_blob_sha1_recomputed': actual,
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          source_manifest = {
              'schema_id': 'study1b.n6.source_manifest',
              'schema_version': 1,
              'repository': 'gharbonnier78/siamese-embedding-compression-lab',
              'pull_request': 50,
              'head_sha': head,
              'base_sha': base,
              'review_scope': 'N4_N5_R1_N2_N6_focused_v0_6_semantic_rereview',
              'git_blob_formula': "SHA1('blob ' + byte_length + NUL + content)",
              'entries': entries,
          }
          (out / '01_SOURCE_MANIFEST.json').write_text(
              json.dumps(source_manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          harness = {
              'repository': 'gharbonnier78/scientific-research-harness',
              'ref': '3b109adcdd9a8cba4df029d3803ee0e5cb5bdf98',
              'path': 'HARNESS.md',
              'expected_git_blob_sha1': 'b5354c9c02c91cfa1e6a0b734741cdf78e39ed1d',
              'immutable_url': 'https://github.com/gharbonnier78/scientific-research-harness/blob/3b109adcdd9a8cba4df029d3803ee0e5cb5bdf98/HARNESS.md',
              'note': 'Immutable external authority; intentionally not duplicated into this consumer package.',
          }
          (out / '02_PINNED_HARNESS.json').write_text(
              json.dumps(harness, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          prompt = [
              '# PR #50 — independent focused v0.6 semantic re-review',
              '',
              f'Head under review: `{head}`',
              f'Base: `{base}`',
              'Pinned harness: `gharbonnier78/scientific-research-harness@3b109adcdd9a8cba4df029d3803ee0e5cb5bdf98`',
              '',
              'This review is limited to N4, N5, R1/N2 and N6. It is not construct-validity review and not execution authorization.',
              '',
              '## Mandatory transport checks',
              '',
              '1. Run `python review_tools/verify_package.py`.',
              '2. Recompute every Git blob SHA-1 in `01_SOURCE_MANIFEST.json` with `SHA1("blob " + byte_length + NUL + content)`.',
              '3. Run `python -m unittest tests.test_study1b_engineering_benchmark_contract_v06 -v` after installing PyYAML.',
              '4. If a normative file is missing or mismatched, report transport failure and do not substitute author summaries.',
              '',
              '## Semantic questions',
              '',
              '- N4: Is mere receipt/possession/citation/review separated from creation/framing influence, with D1 required for produced/commissioned/requested/specified/directed/materially-framed evidence and ambiguity failing closed?',
              '- N5: Is only temporal ordering described as mechanically checkable, with source independence, attester influence and completeness left as provenance/attestation claims?',
              '- R1/N2: Is informational overlap classified per lock-defining choice, preserving portable backend/BLAS, threading/affinity and measurement-method relevance across hardware when transferable, with uncertainty defaulting informative?',
              '- N6: Does this package ship exact normative bytes plus locally recomputable expected Git blob SHA-1 values?',
              '',
              '## Required verdict fields',
              '',
              'VERDICT: ACCEPT | CHANGES_REQUIRED',
              'N4_CLOSED: yes | no',
              'N5_CLOSED: yes | no',
              'R1_N2_PORTABLE_CHOICE_OVERLAP_CLOSED: yes | no',
              'N6_PACKAGE_RULE_SATISFIED: yes | no',
              'CANONICAL_EXECUTION_CURRENTLY_ADMISSIBLE: no',
              'CONSTRUCT_VALIDITY_REVIEWED: no',
              '',
              'Before issuing a verdict, verify the later immutable PR binding comment for this same head and the five bounded workflow successes. Green workflows are technical assurance only.',
              '',
              'Hard boundary: do not open SCREEN, TEST, protected real-route performance or protected geometry; do not launch S4N3; do not execute Phase A.',
          ]
          (out / '03_REVIEWER_PROMPT.md').write_text(
              '\n'.join(prompt) + '\n', encoding='utf-8'
          )

          verifier = [
              'import hashlib, json',
              'from pathlib import Path',
              'ROOT = Path(__file__).resolve().parents[1]',
              'def blob_sha(data):',
              '    return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\\0" + data).hexdigest()',
              'm = json.loads((ROOT / "01_SOURCE_MANIFEST.json").read_text(encoding="utf-8"))',
              'for e in m["entries"]:',
              '    p = ROOT / e["path"]',
              '    if not p.is_file(): raise SystemExit(f"missing: {e[\'path\']}")',
              '    d = p.read_bytes()',
              '    if len(d) != e["byte_length"]: raise SystemExit(f"length mismatch: {e[\'path\']}")',
              '    if blob_sha(d) != e["git_blob_sha1_expected"]: raise SystemExit(f"blob mismatch: {e[\'path\']}")',
              '    if hashlib.sha256(d).hexdigest() != e["sha256"]: raise SystemExit(f"sha256 mismatch: {e[\'path\']}")',
              'print(f"N6 exact-source verification PASS: {len(m[\'entries\'])} files")',
          ]
          vpath = out / 'review_tools/verify_package.py'
          vpath.parent.mkdir(parents=True, exist_ok=True)
          vpath.write_text('\n'.join(verifier) + '\n', encoding='utf-8')

          contents = []
          for p in sorted(x for x in out.rglob('*') if x.is_file()):
              data = p.read_bytes()
              contents.append({
                  'path': p.relative_to(out).as_posix(),
                  'byte_length': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (out / '04_PACKAGE_CONTENTS_SHA256.json').write_text(
              json.dumps({'schema_version': 1, 'entries': contents}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          zip_name = f'PR50_{head[:8].upper()}_V06_N6_FOCUSED_REREVIEW_2026-09-15.zip'
          zip_path = bundle / zip_name
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(x for x in out.rglob('*') if x.is_file()):
                  info = zipfile.ZipInfo(
                      p.relative_to(out).as_posix(),
                      date_time=(1980, 1, 1, 0, 0, 0),
                  )
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, p.read_bytes())
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (bundle / f'{zip_name}.sha256').write_text(
              f'{digest}  {zip_name}\n', encoding='utf-8'
          )
          (bundle / 'PACKAGE_METADATA.json').write_text(
              json.dumps({
                  'head_sha': head,
                  'base_sha': base,
                  'zip_name': zip_name,
                  'zip_sha256': digest,
                  'exact_source_count': len(entries),
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'Built {zip_name} sha256={digest}')
          PY
      - name: Verify exact bytes and focused contract
        working-directory: artifacts/study1b/v06-n6-review-package
        run: |
          python review_tools/verify_package.py
          python -m unittest tests.test_study1b_engineering_benchmark_contract_v06 -v
      - name: Upload focused N6 bundle
        uses: actions/upload-artifact@v4
        with:
          name: study1b-v06-n6-review-package
          path: artifacts/study1b/v06-n6-review-bundle
          if-no-files-found: error
          retention-days: 90
