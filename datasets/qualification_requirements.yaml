schema_version: "1.0.0"
required_sections:
  - provenance_and_licence
  - target_population_and_use_case
  - identity_and_capture_counts
  - inclusion_and_exclusion
  - sensors_and_capture_conditions
  - quality_pose_occlusion_and_time_gap
  - split_unit_and_leakage_audit
  - duplicate_and_cross_dataset_overlap_audit
  - pair_or_gallery_construction
  - statistical_resolution_and_power
  - subgroup_and_regime_coverage_when_authorized
  - privacy_security_and_retention
  - known_limits_and_forbidden_claims
qualification_rules:
  identity_disjoint_test: required
  subject_level_uncertainty: required
  acquisition_hashes: required
  raw_biometric_redistribution: prohibited_without_explicit_licence
  target_fmr_supported_by_effective_trials: required
  population_representativity_must_be_claim_specific: true
  public_availability_is_not_representativity: true
sample_size_policy:
  method: exact_or_validated_binomial_bound_with_dependency_adjustment
  zero_error_rule_of_three_only_as_sanity_check: true
  cluster_or_identity_dependency_must_be_reported: true
  qualification_must_predeclare_precision_or_power: true

