schema_version: "1.0.0"
dataset_id: lfw_dev_protocol_mirror
role: exploratory_development_and_test
source_name: Labeled Faces in the Wild
acquisition:
  configured_mirror: jessicali9530/lfw-dataset
  redistribution_in_repository: false
  run_records_file_hashes: true
protocol:
  development_source: LFW DevTrain pairs
  untouched_test_source: LFW DevTest pairs
  train_pairs: 842
  validation_pairs: 795
  test_pairs: 1000
  test_genuine_pairs: 500
  test_impostor_pairs: 500
  empirical_fmr_step: 0.002
split_assurance:
  train_validation_identity_disjoint: true
  test_opened_after_freeze: true
  cross_dataset_overlap_audit: not_applicable_single_dataset_study
representativity:
  target_population_declared: false
  operational_sensor_distribution_declared: false
  controlled_capture: false
  sufficient_for_industrial_low_fmr: false
  permitted_use: educational mechanism audit and limited exploratory comparison
  forbidden_use: industrial, regulatory, national-gallery or fairness qualification
limitations:
  - ImageNet ResNet-18 is not a face-specific extractor.
  - Five hundred impostor test pairs cannot resolve low industrial FMR targets.
  - Public web imagery is not an operational population specification.
  - Pair dependencies and identity reuse limit naive independent-trial interpretations.

